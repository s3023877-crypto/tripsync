[build]
  publish = "."
  command = "node scripts/generate-env.mjs"

[build.environment]
  NODE_VERSION = "22"

# SPA/hash-route fallback. Netlify serves index.html for all app routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service workers should be revalidated so push code updates reach devices.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=UTF-8"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"
