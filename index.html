<script>
 /* Anything that stops the app before React renders gets shown on the page,
    so a blank "Starting TripSync…" never leaves you guessing. */
 window.bootFail = 
function ResetPasswordScreen({ onDone }) {
  const [password, setPassword] = useState('')
  const [confirm, setConfirm] = useState('')
  const [showPassword, setShowPassword] = useState(false)
  const [showConfirm, setShowConfirm] = useState(false)
  const [busy, setBusy] = useState(false)
  const [error, setError] = useState(null)
  const [success, setSuccess] = useState(false)

  async function submit(e) {
    e.preventDefault()
    setError(null)
    if (password.length < 6) { setError('Password must be at least 6 characters.'); return }
    if (password !== confirm) { setError('Passwords do not match.'); return }
    setBusy(true)
    try {
      const { error } = await sb.auth.updateUser({ password })
      if (error) throw new Error(error.message)
      setSuccess(true)
    } catch (err) {
      setError(err.message || 'Could not update your password.')
    } finally { setBusy(false) }
  }

  if (success) return (
    <div className="min-h-screen bg-slate-50 px-4 py-10">
      <div className="mx-auto max-w-md rounded-2xl border border-line bg-white p-6 shadow-card">
        <div className="mb-4 flex h-11 w-11 items-center justify-center rounded-full bg-brand/10 text-xl text-brand">✓</div>
        <h1 className="text-xl font-semibold">Password updated</h1>
        <p className="muted mt-2">Your TripSync password has been changed successfully.</p>
        <button type="button" className="btn btn-brand mt-6 w-full" onClick={onDone}>Continue to TripSync</button>
      </div>
    </div>
  )

  return (
    <div className="min-h-screen bg-slate-50 px-4 py-10">
      <div className="mx-auto max-w-md rounded-2xl border border-line bg-white p-6 shadow-card">
        <div className="mb-5">
          <div className="mb-4 flex h-11 w-11 items-center justify-center rounded-full bg-brand/10 text-xl text-brand">🔐</div>
          <h1 className="text-xl font-semibold">Set a new password</h1>
          <p className="muted mt-1">Choose a new password for your TripSync account.</p>
        </div>
        <form className="space-y-4" onSubmit={submit}>
          <div>
            <label className="label">New password</label>
            <div className="relative">
              <input className="input pr-16" type={showPassword ? 'text' : 'password'} value={password}
                onChange={(e) => setPassword(e.target.value)} autoComplete="new-password" required />
              <button type="button" className="absolute right-2 top-1/2 -translate-y-1/2 text-xs font-medium text-brand"
                onClick={() => setShowPassword((v) => !v)}>{showPassword ? 'Hide' : 'Show'}</button>
            </div>
            <p className="muted mt-1 text-xs">Use at least 6 characters.</p>
          </div>
          <div>
            <label className="label">Confirm password</label>
            <div className="relative">
              <input className="input pr-16" type={showConfirm ? 'text' : 'password'} value={confirm}
                onChange={(e) => setConfirm(e.target.value)} autoComplete="new-password" required />
              <button type="button" className="absolute right-2 top-1/2 -translate-y-1/2 text-xs font-medium text-brand"
                onClick={() => setShowConfirm((v) => !v)}>{showConfirm ? 'Hide' : 'Show'}</button>
            </div>
          </div>
          {error && <div className="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">{error}</div>}
          <button type="submit" className="btn btn-brand w-full" disabled={busy}>
            {busy ? 'Updating password…' : 'Update password'}
          </button>
        </form>
      </div>
    </div>
  )
}

function (heading) {

       '</div>' +
     '</div>'
 }

 window.addEventListener('error', function (e) {
   if (e.target && e.target.dataset && e.target.dataset.optional) {
     return   // env.js is expected to be missing until you create it
   }
   if (e.target && e.target.tagName === 'SCRIPT') {
     window.bootFail('dependency')
   } else {
     window.bootFail('startup')
   }
 }, true)

 // If nothing has rendered after a few seconds, say so.
 setTimeout(function () {
   if (document.getElementById('boot') && !document.getElementById('root').dataset.failed) {
     window.bootFail('timeout')
   }
 }, 6000)

<script type="text/babel" data-presets="react">
/* ==========================================================================
  CONFIG — supplied by env.js, which Netlify writes at deploy time from the
  environment variables you set in its dashboard. Nothing to edit here.
  Locally, create env.js next to this file (see .env.example).
  ========================================================================== */
const ENV = (typeof window !== 'undefined' && window.TRIPSYNC_ENV) || {}
const CONFIG = {
 url: ENV.url || '',
 anonKey: ENV.anonKey || '',
 vapidPublicKey: ENV.vapidPublicKey || '',
}

/* --------------------------------------------------------------------------
  BRANDING — pick a mark and a footer style. Four marks are drawn below.
  -------------------------------------------------------------------------- */
const BRAND = {
 mark: 'route',                     // 'route' | 'pin' | 'stamp' | 'compass'
 wordmark: 'TripSync',
 tagline: 'Plan the trip together',
 footer: 'full',                    // 'full' | 'minimal' | 'off'
 credit: 'Pixel Pilot',             // shown at the foot of every page
 creditUrl: 'https://pixelpilot.example',  // put your site here; '' for plain text
}

const isConfigured =
 /^https:\/\/[a-z0-9-]+\.supabase\.co/.test(CONFIG.url) && CONFIG.anonKey.length > 40

const { useState, useEffect, useMemo, useRef, useCallback } = React

// The UMD bundle publishes itself as window.supabase; our client is `sb`.
const sb = window.supabase.createClient(
 isConfigured ? CONFIG.url : 'https://placeholder.supabase.co',
 isConfigured ? CONFIG.anonKey : 'placeholder',
 { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
)

/* --------------------------------------------------------------------------
  Web Push — registration is optional until the user turns Alerts on.
  The public VAPID key is safe in the frontend; the private key stays in the
  Supabase Edge Function.
  -------------------------------------------------------------------------- */
function urlBase64ToUint8Array(base64String) {
 const padding = '='.repeat((4 - base64String.length % 4) % 4)
 const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/')
 const raw = atob(base64)
 return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)))
}

async function getPushRegistration() {
 if (!('serviceWorker' in navigator) || !('PushManager' in window) || !CONFIG.vapidPublicKey) return null
 const reg = await navigator.serviceWorker.register('./sw.js')
 await navigator.serviceWorker.ready
 return reg
}

async function registerTripSyncPush() {
 const permission = typeof Notification !== 'undefined'
   ? await Notification.requestPermission()
   : 'denied'
 if (permission !== 'granted') return null
 const reg = await getPushRegistration()
 if (!reg) return null
 let sub = await reg.pushManager.getSubscription()
 if (!sub) {
   sub = await reg.pushManager.subscribe({
     userVisibleOnly: true,
     applicationServerKey: urlBase64ToUint8Array(CONFIG.vapidPublicKey),
   })
 }
 const json = sub.toJSON()
 const id = await uid()
 if (!id || !json.endpoint || !json.keys?.p256dh || !json.keys?.auth) return sub
 const result = await sb.from('push_subscriptions').upsert({
   user_id: id,
   endpoint: json.endpoint,
   p256dh: json.keys.p256dh,
   auth: json.keys.auth,
   user_agent: navigator.userAgent,
   updated_at: new Date().toISOString(),
 }, { onConflict: 'user_id,endpoint' })
 if (result.error) throw new Error(result.error.message)
 return sub
}

async function disableTripSyncPush() {
 if (!('serviceWorker' in navigator)) return
 const reg = await navigator.serviceWorker.getRegistration('./sw.js') || await navigator.serviceWorker.getRegistration()
 if (!reg) return
 const sub = await reg.pushManager.getSubscription()
 if (!sub) return
 const endpoint = sub.endpoint
 const id = await uid()
 await sub.unsubscribe()
 if (id && endpoint) {
   await sb.from('push_subscriptions').delete().eq('user_id', id).eq('endpoint', endpoint)
 }
}

/* ==========================================================================
  1. Helpers — hooks, formatting, and the money maths
  ========================================================================== */

/** Run an async function; expose { data, loading, error, reload }. */
function useAsync(fn, deps = []) {
 const [state, setState] = useState({ data: null, loading: true, error: null })
 const [tick, setTick] = useState(0)
 const fnRef = useRef(fn)
 fnRef.current = fn

 useEffect(() => {
   let alive = true
   setState((s) => ({ ...s, loading: true }))
   Promise.resolve()
     .then(() => fnRef.current())
     .then((data) => alive && setState({ data, loading: false, error: null }))
     .catch((e) => alive && setState({ data: null, loading: false, error: e.message || String(e) }))
   return () => { alive = false }
 }, [...deps, tick])

 return { ...state, reload: useCallback(() => setTick((t) => t + 1), []) }
}

function useHashRoute() {
 const read = () => window.location.hash.replace(/^#/, '') || '/'
 const [route, setRoute] = useState(read)
 useEffect(() => {
   const onChange = () => setRoute(read())
   window.addEventListener('hashchange', onChange)
   return () => window.removeEventListener('hashchange', onChange)
 }, [])
 return route
}

const go = (path) => { window.location.hash = path; window.scrollTo({ top: 0 }) }
const cls = (...parts) => parts.filter(Boolean).join(' ')
const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100

function money(value, currency = 'INR') {
 const n = Number(value) || 0
 try {
   return new Intl.NumberFormat(undefined, {
     style: 'currency', currency, maximumFractionDigits: n % 1 === 0 ? 0 : 2,
   }).format(n)
 } catch { return `${currency} ${n.toFixed(2)}` }
}

const dtf = (opts) => new Intl.DateTimeFormat(undefined, opts)

/** "2026-03-14" means local midnight, not UTC midnight. */
const toDate = (value) =>
 new Date(/^\d{4}-\d{2}-\d{2}$/.test(String(value)) ? `${value}T00:00:00` : value)

/** Local calendar day of a timestamp — the key the itinerary groups on. */
function localDay(value) {
 const d = toDate(value)
 const pad = (n) => String(n).padStart(2, '0')
 return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`
}

const dateLabel = (v) => (v ? dtf({ day: 'numeric', month: 'short', year: 'numeric' }).format(toDate(v)) : '')
const dayLabel = (v) => (v ? dtf({ weekday: 'short', day: 'numeric', month: 'short' }).format(toDate(v)) : '')
const timeLabel = (v) => (v ? dtf({ hour: 'numeric', minute: '2-digit' }).format(toDate(v)) : '')

function dateRange(start, end) {
 if (!start && !end) return 'Dates not set yet'
 if (!end) return dateLabel(start)
 const sameYear = toDate(start).getFullYear() === toDate(end).getFullYear()
 const left = sameYear ? dtf({ day: 'numeric', month: 'short' }).format(toDate(start)) : dateLabel(start)
 return `${left} – ${dateLabel(end)}`
}

function relativeTime(value) {
 const mins = Math.round((Date.now() - new Date(value).getTime()) / 60000)
 if (mins < 1) return 'just now'
 if (mins < 60) return `${mins}m ago`
 const hours = Math.round(mins / 60)
 if (hours < 24) return `${hours}h ago`
 const days = Math.round(hours / 24)
 return days < 7 ? `${days}d ago` : dateLabel(value)
}

/** upcoming | live | past — drives badges and the History page. */
function tripPhase(trip) {
 const today = new Date().toISOString().slice(0, 10)
 if (trip.status === 'done') return 'past'
 if (trip.end_date && trip.end_date < today) return 'past'
 if (trip.start_date && trip.start_date > today) return 'upcoming'
 return 'live'
}

function countdown(trip) {
 if (!trip.start_date) return null
 const days = Math.ceil((toDate(trip.start_date) - new Date()) / 86400000)
 if (days > 1) return `in ${days} days`
 if (days === 1) return 'tomorrow'
 if (days === 0) return 'today'
 return null
}

function tripLengthDays(trip) {
 if (!trip.start_date || !trip.end_date) return 0
 return Math.max(1, Math.round((toDate(trip.end_date) - toDate(trip.start_date)) / 86400000) + 1)
}

/** Group timestamped rows into ordered day buckets. */
function groupByDay(items, key = 'start_time') {
 const buckets = new Map()
 for (const item of items) {
   const day = localDay(item[key])
   if (!buckets.has(day)) buckets.set(day, [])
   buckets.get(day).push(item)
 }
 return [...buckets.entries()]
   .sort(([a], [b]) => a.localeCompare(b))
   .map(([day, rows]) => ({ day, rows: rows.sort((a, b) => String(a[key]).localeCompare(String(b[key]))) }))
}

const nameOf = (members, id, fallback = 'Former member') =>
 members.find((m) => m.id === id)?.name || fallback

/**
* What to call someone. A saved name wins; otherwise the part of their email
* before the @, so the greeting is never empty. Updating the profile changes
* it everywhere at once.
*/
function displayName(profile, email = '') {
 const saved = (profile?.full_name || '').trim()
 if (saved) return saved
 const fromEmail = String(email).split('@')[0].replace(/[._-]+/g, ' ').trim()
 return fromEmail || 'Traveller'
}

const firstNameOf = (name = '') => name.trim().split(/\s+/)[0] || ''

/**
* An admin can do everything on a trip. 'owner' is still recognised so a
* database mid-upgrade keeps working, but nothing writes it any more.
*/
const isAdmin = (members, me) =>
 ['admin', 'owner'].includes(members.find((m) => m.id === me)?.role)

function initials(name = '') {
 const parts = name.trim().split(/\s+/).slice(0, 2)
 return parts.map((p) => p[0]?.toUpperCase() || '').join('') || '?'
}

/** Deterministic tint so the same person keeps the same colour. */
function avatarTint(id = '') {
 const tints = [
   'bg-brand-wash text-brand-dark',
   'bg-signal-wash text-[#8A5B0E]',
   'bg-alert-wash text-alert',
   'bg-ink/10 text-ink',
   'bg-[#E8EAF6] text-[#3B4A8C]',
 ]
 let n = 0
 for (const ch of id) n += ch.charCodeAt(0)
 return tints[n % tints.length]
}

const CATEGORIES = ['Travel', 'Stay', 'Food', 'Activities', 'Shopping', 'Other']

/**
* Only ever render http(s). A stored 'javascript:' or 'data:' URL would
* execute on click, so anything else becomes an inert '#'. The database has a
* matching constraint; this is the second line, because a row could predate it.
*/
function safeUrl(url) {
 const trimmed = String(url || '').trim()
 return /^https?:\/\/[^\s]+$/i.test(trimmed) ? trimmed : '#'
}

/** A phone number safe to put after tel:. */
function telUrl(phone) {
 const cleaned = String(phone || '').replace(/[^\d+]/g, '')
 return cleaned ? `tel:${cleaned}` : '#'
}

/** "drive.google.com" out of a full URL, for a tidy link row. */
function hostOf(url) {
 try { return new URL(url).hostname.replace(/^www\./, '') } catch { return url }
}

/**
* Where one question round stands.
*
* The asker is asking everyone else, so they are not counted and their own
* replies are ignored: a round waits for headcount - 1 people and packs itself
* once they have all answered. Anyone may wrap it early. Progress counts
* people, not messages, so a chatty answerer cannot finish a round alone.
*
* A round asked when nobody else was on the trip has a target of zero; it
* stays open rather than packing instantly, so it is still there to answer
* once somebody joins.
*/
function roundState(question, answers) {
 const author = question.created_by
 const fromOthers = answers.filter((a) => a.user_id !== author)
 const people = new Set(fromOthers.map((a) => a.user_id))
 const target = Math.max(0, (question.headcount || 1) - 1)
 const answered = people.size
 const everyone = target > 0 && answered >= target
 return {
   answered, target, everyone,
   replies: fromOthers.length,
   waiting: Math.max(0, target - answered),
   pct: target > 0 ? Math.min(100, Math.round((answered / target) * 100)) : 0,
   packed: Boolean(question.closed_at) || everyone,
   reason: question.closed_at ? 'wrapped' : everyone ? 'everyone' : 'open',
 }
}

/**
* Where a group vote stands. Percentages are of everyone on the trip, not of
* whoever happened to vote, so one accept out of five reads as 20% and never
* carries. A verdict needs more than half the group behind it.
*/
function tally(votes, headcount) {
 const accept = votes.filter((v) => v.vote === 'accept').length
 const decline = votes.filter((v) => v.vote === 'decline').length
 const total = Math.max(1, headcount)
 const pct = (k) => Math.round((k / total) * 100)
 const majority = Math.floor(total / 2) + 1
 return {
   accept, decline, headcount: total,
   voted: accept + decline,
   pending: Math.max(0, total - accept - decline),
   acceptPct: pct(accept),
   declinePct: pct(decline),
   majority,
   verdict: accept >= majority ? 'accepted' : decline >= majority ? 'declined' : 'open',
 }
}

const sum = (rows, pick = (r) => r) =>
 round2(rows.reduce((total, row) => total + (Number(pick(row)) || 0), 0))

/**
* What one person's own spending comes to, per category. This is what a
* personal budget is measured against: a 1,200 dinner split three ways adds
* 400 to that person's Food line, not 1,200.
*/
function myShareByCategory(expenses, userId) {
 const out = {}
 for (const c of CATEGORIES) out[c] = 0
 for (const e of expenses) {
   const mine = (e.expense_shares || []).find((s) => s.user_id === userId)
   if (!mine) continue
   const cat = CATEGORIES.includes(e.category) ? e.category : 'Other'
   out[cat] = round2(out[cat] + Number(mine.amount))
 }
 return out
}

/** Split evenly in whole paise; leftover units go to the first few people. */
function splitEqual(total, userIds) {
 const ids = [...userIds]
 if (!ids.length) return []
 const paise = Math.round((Number(total) || 0) * 100)
 const base = Math.floor(paise / ids.length)
 let extra = paise - base * ids.length
 return ids.map((id) => {
   const bonus = extra > 0 ? 1 : 0
   extra -= bonus
   return { user_id: id, amount: (base + bonus) / 100 }
 })
}

/**
* Net position per person: positive means the group owes them.
*
* Anyone who appears in the money is included, not only current members. If
* somebody leaves a trip mid-way their share does not evaporate — it would
* leave the ledger unbalanced and quietly change what everybody else owes.
* The settle-up view labels them as a former member.
*/
function netBalances(expenses, settlements, memberIds) {
 const net = {}
 for (const id of memberIds) net[id] = 0
 const involve = (id) => { if (id && !(id in net)) net[id] = 0 }
 for (const e of expenses) {
   involve(e.paid_by)
   for (const s of e.expense_shares || []) involve(s.user_id)
 }
 for (const s of settlements) { involve(s.from_user); involve(s.to_user) }
 const bump = (id, delta) => { if (id in net) net[id] += delta }
 for (const e of expenses) {
   bump(e.paid_by, Number(e.amount))
   for (const s of e.expense_shares || []) bump(s.user_id, -Number(s.amount))
 }
 for (const s of settlements) {
   bump(s.from_user, Number(s.amount))
   bump(s.to_user, -Number(s.amount))
 }
 for (const id of Object.keys(net)) net[id] = round2(net[id])
 return net
}

/** Fewest transfers that clear the board: biggest debtor meets biggest creditor. */
function settlementPlan(net) {
 const owe = Object.entries(net).filter(([, v]) => v < -0.009)
   .map(([id, v]) => ({ id, amount: -v })).sort((a, b) => b.amount - a.amount)
 const due = Object.entries(net).filter(([, v]) => v > 0.009)
   .map(([id, v]) => ({ id, amount: v })).sort((a, b) => b.amount - a.amount)

 const transfers = []
 let i = 0, j = 0
 while (i < owe.length && j < due.length) {
   const amount = round2(Math.min(owe[i].amount, due[j].amount))
   if (amount > 0.009) transfers.push({ from: owe[i].id, to: due[j].id, amount })
   owe[i].amount = round2(owe[i].amount - amount)
   due[j].amount = round2(due[j].amount - amount)
   if (owe[i].amount <= 0.009) i += 1
   if (due[j].amount <= 0.009) j += 1
 }
 return transfers
}

/* ==========================================================================
  2. Data layer — every read and write in the app goes through `api`
  ========================================================================== */

/**
* Every failure is classified once, here, so the UI can show the right screen
* instead of a raw Postgres string: a denied row, an expired session and a
* dead connection need three different answers.
*/
function friendlyErrorByKind(kind) {
 return FRIENDLY[kind] || 'Something went wrong. Please try again.'
}

function friendlyError(error, fallback = 'Something went wrong. Please try again.') {
 const kind = typeof error === 'object' && error?.kind ? error.kind : classify(error)
 if (FRIENDLY[kind]) return FRIENDLY[kind]
 const msg = String(error?.message || error || '').trim()
 if (!msg) return fallback
 if (/supabase|postgrest|postgres|pgrst|jwt|row-level|permission denied|relation .* does not exist|schema cache|failed to fetch|networkerror|network request failed/i.test(msg)) {
   return kind === 'offline' ? FRIENDLY.offline : fallback
 }
 return msg.length <= 180 ? msg : fallback
}

function classify(error) {
 const msg = String(error?.message || error || '')
 const code = error?.code || ''
 if (/Failed to fetch|NetworkError|network request failed/i.test(msg)) return 'offline'
 if (/JWT|token is expired|not authenticated|Invalid Refresh Token/i.test(msg)) return 'expired'
 if (code === '42501' || code === 'PGRST301' || /row-level security|permission denied/i.test(msg)) {
   return 'denied'
 }
 if (code === 'PGRST116' || /0 rows/i.test(msg)) return 'missing'
 if (code === '23514' || /check constraint/i.test(msg)) return 'invalid'
 if (code === '23505' || /duplicate key/i.test(msg)) return 'duplicate'
 return 'failed'
}

/**
* Anything interested in a failure listens here. Every failed request is
* announced, because most inline actions — ticking a checklist item, voting,
* clearing an RSVP — are fire-and-forget: without this, a refusal or a dropped
* connection would look exactly like success.
*/
const appFault = {
 listeners: new Set(),
 emit(kind, error) { for (const fn of this.listeners) fn(kind, error) },
 watch(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn) },
}

window.addEventListener('unhandledrejection', (event) => {
 const error = event.reason || new Error('Something went wrong. Please try again.')
 const kind = classify(error)
 appFault.emit(kind, error)
})

class DataError extends Error {
 constructor(error) {
   const kind = classify(error)
   super(friendlyErrorByKind(kind))
   this.kind = kind
   this.code = error?.code || ''
 }
}

async function run(query) {
 let result
 try {
   result = await query
 } catch (networkError) {
   const wrapped = new DataError(networkError)
   appFault.emit(wrapped.kind, wrapped)
   throw wrapped
 }
 if (result.error) {
   const wrapped = new DataError(result.error)
   appFault.emit(wrapped.kind, wrapped)
   throw wrapped
 }
 return result.data
}

const uid = () => sb.auth.getUser().then(({ data }) => data.user?.id ?? null)

const api = {
 // ---- auth -------------------------------------------------------------
 async signUp({ email, password, fullName, phone }) {
   // Check our server-side auth lookup first so a second registration is
   // clearly rejected instead of showing the generic confirmation message.
   const { data: emailExists, error: lookupError } = await sb.rpc('email_exists', {
     p_email: email.trim(),
   })
   if (lookupError) throw new Error(lookupError.message)
   if (emailExists === true) {
     throw new Error('Mail ID already exists. Please sign in instead.')
   }
   const { data, error } = await sb.auth.signUp({
     email: email.trim(), password, options: { data: { full_name: fullName, phone } },
   })
   if (error) {
     const msg = String(error.message || '').toLowerCase()
     if (msg.includes('already registered') || msg.includes('already exists') || msg.includes('user already registered')) {
       throw new Error('Mail ID already exists. Please sign in instead.')
     }
     throw new Error(error.message)
   }
   return data
 },
 async signIn({ email, password }) {
   const { data, error } = await sb.auth.signInWithPassword({ email, password })
   if (error) throw new Error(error.message)
   return data
 },
 async resetPassword(email) {
   const redirectTo = `${window.location.origin}${window.location.pathname}?reset-password=1`
   const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo })
   if (error) throw new Error(error.message)
 },
 signOut: () => run(sb.auth.signOut()),

 async myProfile() {
   const id = await uid()
   if (!id) return null
   return run(sb.from('profiles').select('*').eq('id', id).maybeSingle())
 },
 async saveProfile(patch) {
   const id = await uid()
   return run(sb.from('profiles').update(patch).eq('id', id).select().single())
 },

 // ---- trips ------------------------------------------------------------
 async myTrips() {
   const id = await uid()
   if (!id) return []
   const rows = await run(
     sb.from('trip_members').select('role, joined_at, trips(*)')
       .eq('user_id', id).order('joined_at', { ascending: false })
   )
   return rows.filter((r) => r.trips).map((r) => ({ ...r.trips, myRole: r.role }))
 },
 createTrip: ({ name, destination, startDate, endDate, budget, currency }) =>
   run(sb.rpc('create_trip', {
     p_name: name, p_destination: destination || '', p_start: startDate || null,
     p_end: endDate || null, p_budget: Number(budget) || 0, p_currency: currency || 'INR',
   })),
 joinTrip: (code) => run(sb.rpc('join_trip', { p_code: code })),
 leaveTrip: (tripId) => run(sb.rpc('leave_trip', { p_trip: tripId })),
 trip: (tripId) => run(sb.from('trips').select('*').eq('id', tripId).single()),
 saveTrip: (tripId, patch) => run(sb.from('trips').update(patch).eq('id', tripId).select().single()),

 async members(tripId) {
   const rows = await run(
     sb.from('trip_members')
       .select('user_id, role, joined_at, budget, seen, profiles(full_name, phone)')
       .eq('trip_id', tripId).order('joined_at')
   )
   return rows.map((r) => ({
     id: r.user_id,
     role: r.role,
     budget: Number(r.budget) || 0,
     seen: r.seen || {},
     joinedAt: r.joined_at,
     name: r.profiles?.full_name || 'Traveller',
     phone: r.profiles?.phone || '',
   }))
 },

 // ---- generic trip-scoped CRUD ----------------------------------------
 list: (table, tripId, { select = '*', column = 'created_at', ascending = false } = {}) =>
   run(sb.from(table).select(select).eq('trip_id', tripId).order(column, { ascending })),

 /** Stamps created_by on the tables that track an author. */
 async insert(table, row) {
   const tracksAuthor = !['attendance', 'member_locations', 'budget_lines',
                          'posts', 'post_replies'].includes(table)
   const payload = tracksAuthor && !('created_by' in row) ? { ...row, created_by: await uid() } : row
   return run(sb.from(table).insert(payload).select().single())
 },
 update: (table, id, patch) => run(sb.from(table).update(patch).eq('id', id).select().single()),
 remove: (table, id) => run(sb.from(table).delete().eq('id', id)),

 // ---- features needing more than plain CRUD ---------------------------
 polls: (tripId) => api.list('polls', tripId, { select: '*, poll_votes(user_id, option_index)' }),

 async vote(pollId, optionIndex) {
   const id = await uid()
   const { data: poll, error: pollError } = await sb.from('polls')
     .select('id, allow_multiple, closed')
     .eq('id', pollId).single()
   if (pollError) throw pollError
   if (poll.closed) throw new Error('This poll is closed')

   const { data: mine, error: mineError } = await sb.from('poll_votes')
     .select('option_index')
     .eq('poll_id', pollId).eq('user_id', id)
   if (mineError) throw mineError

   const selected = (mine || []).some(v => Number(v.option_index) === Number(optionIndex))

   if (poll.allow_multiple) {
     if (selected) {
       return run(sb.from('poll_votes').delete()
         .eq('poll_id', pollId).eq('user_id', id).eq('option_index', optionIndex))
     }
     return run(sb.from('poll_votes').insert({
       poll_id: pollId, user_id: id, option_index: optionIndex
     }))
   }

   // Single-answer poll: selecting another option replaces the previous answer.
   const removeOtherAnswers = await sb.from('poll_votes')
     .delete().eq('poll_id', pollId).eq('user_id', id)
   if (removeOtherAnswers.error) throw removeOtherAnswers.error
   return run(sb.from('poll_votes').insert({
     poll_id: pollId, user_id: id, option_index: optionIndex
   }))
 },

 /** Passing the same answer twice clears it, so an RSVP can be undone. */
 async rsvp(tripId, itemId, status) {
   const id = await uid()
   if (!status) {
     return run(sb.from('attendance').delete().eq('item_id', itemId).eq('user_id', id))
   }
   return run(sb.from('attendance').upsert(
     { trip_id: tripId, item_id: itemId, user_id: id, status, updated_at: new Date().toISOString() },
     { onConflict: 'item_id,user_id' }
   ))
 },

 suggestions: (tripId) =>
   api.list('suggestions', tripId, { select: '*, suggestion_votes(user_id, vote)' }),

 /** A suggestion always belongs to a stop. */
 suggest: (tripId, itemId, body) =>
   api.insert('suggestions', { trip_id: tripId, item_id: itemId, body }),

 /** Accept or decline a suggestion; the same answer again withdraws it. */
 async voteSuggestion(tripId, suggestionId, vote) {
   const id = await uid()
   if (!vote) {
     return run(sb.from('suggestion_votes').delete()
       .eq('suggestion_id', suggestionId).eq('user_id', id))
   }
   return run(sb.from('suggestion_votes').upsert(
     { trip_id: tripId, suggestion_id: suggestionId, user_id: id, vote, voted_at: new Date().toISOString() },
     { onConflict: 'suggestion_id,user_id' }
   ))
 },

 /** Owner or admin only; enforced in SQL, not just here. */
 setMemberRole: (tripId, userId, role) =>
   run(sb.rpc('set_member_role', { p_trip: tripId, p_user: userId, p_role: role })),

 /** The board: notices and questions in one feed, replies embedded. */
 posts: (tripId) =>
   api.list('posts', tripId, { select: '*, post_replies(id, user_id, body, created_at)' }),

 /** headcount is snapshotted so a later joiner cannot un-pack a round. */
 async post({ tripId, kind, title, body, state, pinned, headcount }) {
   const id = await uid()
   return run(sb.from('posts').insert({
     trip_id: tripId,
     kind,
     title: title || '',
     body,
     state: state || 'ok',
     pinned: Boolean(pinned),
     headcount: Math.max(1, headcount || 1),
     created_by: id,
   }).select().single())
 },

 async reply(tripId, postId, body) {
   const id = await uid()
   return run(sb.from('post_replies')
     .insert({ trip_id: tripId, post_id: postId, user_id: id, body })
     .select().single())
 },

 /** Any member may wrap a round early; the RPC checks membership. */
 wrapPost: (postId, wrapped) =>
   run(sb.rpc('wrap_post', { p_post: postId, p_wrapped: wrapped })),

 links: (tripId) => api.list('trip_links', tripId),

 /** Latest activity per area in one round trip, for the unread badges. */
 activity: (tripId) => run(sb.rpc('trip_activity', { p_trip: tripId })),

 markSeen: (tripId, area) => run(sb.rpc('mark_seen', { p_trip: tripId, p_area: area })),

 expenses: (tripId) =>
   api.list('expenses', tripId, { select: '*, expense_shares(user_id, amount)', column: 'spent_on' }),

 addExpense: ({ tripId, description, amount, category, paidBy, spentOn, shares }) =>
   run(sb.rpc('add_expense', {
     p_trip: tripId, p_description: description, p_amount: Number(amount),
     p_category: category, p_paid_by: paidBy, p_spent_on: spentOn, p_shares: shares,
   })),

 /** Budget lines belong to one person, so they carry user_id. */
 async saveBudgetLine(tripId, category, planned) {
   const id = await uid()
   return run(sb.from('budget_lines')
     .upsert({ trip_id: tripId, user_id: id, category, planned: Number(planned) || 0 },
             { onConflict: 'trip_id,user_id,category' })
     .select().single())
 },

 /** Each member sets their own overall budget for the trip. */
 async setMyBudget(tripId, amount) {
   const id = await uid()
   return run(sb.from('trip_members')
     .update({ budget: Number(amount) || 0 })
     .eq('trip_id', tripId).eq('user_id', id).select().single())
 },

 /** Ticks are personal: a row exists only for the member who ticked. */
 async toggleCheck(tripId, itemId, on) {
   const id = await uid()
   if (!on) {
     return run(sb.from('checklist_checks').delete().eq('item_id', itemId).eq('user_id', id))
   }
   return run(sb.from('checklist_checks').upsert(
     { trip_id: tripId, item_id: itemId, user_id: id, checked_at: new Date().toISOString() },
     { onConflict: 'item_id,user_id' }
   ))
 },

 /**
  * Ticking a stop off moves it to the completed plan. This goes through an
  * RPC, not a direct update: stop_update restricts edits to the stop's
  * author, but completing one is something any member on the trip can do.
  */
 completeStop: (itemId, done) =>
   run(sb.rpc('complete_stop', { p_item: itemId, p_done: done })),

 /** Permanent: every itinerary, expense and message for the trip goes too. */
 deleteTrip: (tripId) => run(sb.from('trips').delete().eq('id', tripId)),

 async shareLocation(tripId, { lat, lng, accuracy }) {
   const id = await uid()
   return run(sb.from('member_locations').upsert(
     { trip_id: tripId, user_id: id, lat, lng, accuracy: accuracy ?? null, updated_at: new Date().toISOString() },
     { onConflict: 'trip_id,user_id' }
   ))
 },
 async stopSharingLocation(tripId) {
   const id = await uid()
   return run(sb.from('member_locations').delete().eq('trip_id', tripId).eq('user_id', id))
 },

 /** One channel per trip: any change re-runs the open tab's queries. */
 subscribeTrip(tripId, onChange) {
   const tables = [
     'itinerary_items', 'suggestions', 'attendance', 'polls', 'poll_votes',
     'posts', 'post_replies', 'trip_links',
     'checklist_items', 'checklist_checks', 'suggestion_votes', 'emergency_contacts',
     'budget_lines', 'expenses', 'expense_shares', 'settlements',
     'member_locations', 'trip_members',
   ]
   const channel = sb.channel(`trip:${tripId}`)
   for (const table of tables) {
     channel.on('postgres_changes', { event: '*', schema: 'public', table }, onChange)
   }
   channel.subscribe()
   return () => sb.removeChannel(channel)
 },
}

const STATE_ART = {
 loading: null,
 offline: '⚡',
 denied: '🔒',
 expired: '⏳',
 missing: '🧭',
 failed: '⚠',
 empty: '·',
}

 return (
   <div className="mx-auto flex min-h-[70vh] w-full max-w-md flex-col items-center justify-center px-4 text-center">
     {kind === 'loading' ? (

/**
* A quiet line at the foot of the screen for failures nothing else reports.
* Expiry has its own screen, so it is skipped here.
*/
function FaultToast() {
 const [fault, setFault] = useState(null)
 useEffect(() => appFault.watch((kind, error) => {
   if (kind === 'expired') return
   setFault({ kind, text: friendlyError(error) })
 }), [])
 useEffect(() => {
   if (!fault) return
   const t = setTimeout(() => setFault(null), 6000)
   return () => clearTimeout(t)
 }, [fault])

 if (!fault) return null
 return ReactDOM.createPortal(
   <div className="pointer-events-none fixed inset-x-0 bottom-0 z-[70] flex justify-center p-4">
     <div role="status"
       className="pointer-events-auto flex max-w-md items-start gap-3 rounded-lg border border-alert/25 bg-white px-3.5 py-2.5 text-[13px] text-ink shadow-lift">
       <span className="mt-0.5 h-1.5 w-1.5 shrink-0 rounded-full bg-alert" aria-hidden="true" />
       <span className="flex-1">{fault.text}</span>
       <button type="button" className="shrink-0 text-slate-550 hover:text-ink"
         onClick={() => setFault(null)} aria-label="Dismiss">✕</button>
     </div>
   </div>,
   document.body
 )
}

/** True while the browser reports no connection. */
function useOnline() {
 const [online, setOnline] = useState(
   typeof navigator === 'undefined' ? true : navigator.onLine !== false
 )
 useEffect(() => {
   const up = () => setOnline(true)
   const down = () => setOnline(false)
   window.addEventListener('online', up)
   window.addEventListener('offline', down)
   return () => { window.removeEventListener('online', up); window.removeEventListener('offline', down) }
 }, [])
 return online
}

}

function FieldError({ id, message }) {

/**
* Bottom sheet on phones, centred dialog on bigger screens.
*
* Rendered through a portal on purpose: the sticky header uses backdrop-blur,
* and backdrop-filter creates a containing block, so a fixed-position sheet
* opened from the account menu would anchor to the header and get clipped
* instead of covering the viewport.
*/
function Sheet({ open, title, onClose, children }) {
 useEffect(() => {
   if (!open) return
   const onKey = (e) => e.key === 'Escape' && onClose()
   document.addEventListener('keydown', onKey)
   document.body.style.overflow = 'hidden'
   return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = '' }
 }, [open, onClose])

 if (!open) return null
 return ReactDOM.createPortal(
   <div className="fixed inset-0 z-[60] flex items-end justify-center sm:items-center">
     <button type="button" aria-label="Close" className="absolute inset-0 bg-ink/40" onClick={onClose} />
     <div className="relative max-h-[92vh] w-full max-w-lg overflow-hidden rounded-t-xl bg-white shadow-lift sm:rounded-xl">
       <header className="flex items-center justify-between border-b border-line px-4 py-3">
         <h2 className="text-[17px] font-semibold">{title}</h2>
         <button type="button" className="btn btn-quiet btn-sm -mr-2" onClick={onClose}>Close</button>
       </header>
       <div className="max-h-[calc(92vh-56px)] overflow-y-auto px-4 py-4">{children}</div>
     </div>
   </div>,
   document.body
 )
}

/**
* The tab icon and title come from BRAND too, so switching the mark or
* renaming the app updates the browser tab with everything else.
*/
function applyBrandToTab()

try {
 const mount = document.getElementById('root')
 mount.innerHTML = ''

 // Supabase puts recovery credentials in the URL hash. Because this app uses
 // a hash route, older reset links can arrive as:
 // #/reset-password#access_token=...
 // Normalize those links so Supabase can read the access token.
 const rawHash = window.location.hash
 if (rawHash.startsWith('#/reset-password#')) {
   const recoveryHash = rawHash.slice('#/reset-password'.length)
   sessionStorage.setItem('tripSyncResetRoute', '1')
   window.location.hash = recoveryHash
 }

 const isResetRoute =
   new URLSearchParams(window.location.search).get('reset-password') === '1' ||
   sessionStorage.getItem('tripSyncResetRoute') === '1' ||
   window.location.hash.startsWith('#/reset-password')

 sb.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') {
   sessionStorage.setItem('tripSyncResetRoute', '1')
  }
 })

 ReactDOM.createRoot(mount).render(
   isResetRoute
     ? <ResetPasswordScreen onDone={() => {
         sessionStorage.removeItem('tripSyncResetRoute')
         window.location.href = window.location.origin + window.location.pathname
       }} />
     : <App />
 )
} catch (err) {
 console.error('TripSync boot error:', err)
 window.bootFail('render')
}
</script>

<!--
 NOTES

 Why this works without a build step
 - Tailwind's Play CDN compiles the utility classes in the browser and watches
   the DOM, so classes React renders later still get styles.
 - Babel Standalone compiles the JSX in the script tag above on page load.
 - Supabase's UMD bundle publishes window.supabase; the client here is `sb`.

 Cost of that convenience
 - About 1.5 MB of CDN JavaScript and a compile pass of a few hundred
   milliseconds on first load. Fine for a group of friends; if you want it
   lean, move this script into a Vite project and drop the Tailwind and Babel
   CDN tags — the code itself needs no changes beyond adding imports.

 Deploying
 - Netlify: drag the folder holding this file onto app.netlify.com/drop.
 - Vercel: `vercel --prod` in this folder; no build command, no output dir.
 - GitHub Pages: commit it as index.html on the default branch.
 - Then in Supabase → Authentication → URL Configuration, set Site URL to the
   deployed address so email confirmation links come back to the right place.

 Security
 - The anon key is meant to be public. Row level security in database.sql is
   what protects the data: a trip is readable only by its members, and
   location rows can only be written by the person they belong to.
-->
