<script>
 /* Anything that stops the app before React renders gets shown on the page,
    so a blank "Starting TripSync…" never leaves you guessing. */
 window.bootFail = function (heading, detail) {
   const root = document.getElementById('root')
   if (!root || root.dataset.failed) return
   root.dataset.failed = '1'
   root.innerHTML =
     '<div id="boot"><strong style="color:#C1443E;display:block;font-size:15px;margin-bottom:6px">' +
     heading + '</strong><pre>' + (detail || '') + '</pre></div>'
 }

 window.addEventListener('error', function (e) {
   if (e.target && e.target.dataset && e.target.dataset.optional) {
     return   // env.js is expected to be missing until you create it
   }
   if (e.target && e.target.tagName === 'SCRIPT') {
     window.bootFail('Couldn’t load a dependency', e.target.src +
       '\n\nCheck your internet connection, or whether a network blocks unpkg / jsdelivr.')
   } else {
     window.bootFail('JavaScript error while starting', (e.message || '') +
       (e.filename ? '\n' + e.filename + ':' + e.lineno : ''))
   }
 }, true)

 // If nothing has rendered after a few seconds, say so.
 setTimeout(function () {
   if (document.getElementById('boot') && !document.getElementById('root').dataset.failed) {
     window.bootFail('The app didn’t start',
       'The dependencies loaded but nothing rendered. Open the browser console (F12) — the first red error names the cause.')
   }
 }, 6000)
</script>

<script type="text/babel" data-presets="react">
/* ==========================================================================
  CONFIG — supplied by env.js, which Netlify writes at deploy time from the
  environment variables you set in its dashboard. Nothing to edit here.
  Locally, create env.js next to this file (see .env.example).
  ========================================================================== */
const ENV = (typeof window !== 'undefined' && window.TRIPSYNC_ENV) || {}
const CONFIG = {
 url: ENV.url || '',
 anonKey: ENV.anonKey || '',
}

/* --------------------------------------------------------------------------
  BRANDING — pick a mark and a footer style. Four marks are drawn below.
  -------------------------------------------------------------------------- */
const BRAND = {
 mark: 'route',                     // 'route' | 'pin' | 'stamp' | 'compass'
 wordmark: 'TripSync',
 tagline: 'Plan the trip together',
 footer: 'full',                    // 'full' | 'minimal' | 'off'
 credit: 'Pixel Pilot',             // shown at the foot of every page
 creditUrl: 'https://pixelpilot.example',  // put your site here; '' for plain text
}

const isConfigured =
 /^https:\/\/[a-z0-9-]+\.supabase\.co/.test(CONFIG.url) && CONFIG.anonKey.length > 40

const { useState, useEffect, useMemo, useRef, useCallback } = React

// The UMD bundle publishes itself as window.supabase; our client is `sb`.
const sb = window.supabase.createClient(
 isConfigured ? CONFIG.url : 'https://placeholder.supabase.co',
 isConfigured ? CONFIG.anonKey : 'placeholder',
 { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
)

/* ==========================================================================
  1. Helpers — hooks, formatting, and the money maths
  ========================================================================== */

/** Run an async function; expose { data, loading, error, reload }. */
function useAsync(fn, deps = []) {
 const [state, setState] = useState({ data: null, loading: true, error: null })
 const [tick, setTick] = useState(0)
 const fnRef = useRef(fn)
 fnRef.current = fn

 useEffect(() => {
   let alive = true
   setState((s) => ({ ...s, loading: true }))
   Promise.resolve()
     .then(() => fnRef.current())
     .then((data) => alive && setState({ data, loading: false, error: null }))
     .catch((e) => alive && setState({ data: null, loading: false, error: e.message || String(e) }))
   return () => { alive = false }
 }, [...deps, tick])

 return { ...state, reload: useCallback(() => setTick((t) => t + 1), []) }
}

function useHashRoute() {
 const read = () => window.location.hash.replace(/^#/, '') || '/'
 const [route, setRoute] = useState(read)
 useEffect(() => {
   const onChange = () => setRoute(read())
   window.addEventListener('hashchange', onChange)
   return () => window.removeEventListener('hashchange', onChange)
 }, [])
 return route
}

const go = (path) => { window.location.hash = path; window.scrollTo({ top: 0 }) }
const cls = (...parts) => parts.filter(Boolean).join(' ')
const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100

function money(value, currency = 'INR') {
 const n = Number(value) || 0
 try {
   return new Intl.NumberFormat(undefined, {
     style: 'currency', currency, maximumFractionDigits: n % 1 === 0 ? 0 : 2,
   }).format(n)
 } catch { return `${currency} ${n.toFixed(2)}` }
}

const dtf = (opts) => new Intl.DateTimeFormat(undefined, opts)

/** "2026-03-14" means local midnight, not UTC midnight. */
const toDate = (value) =>
 new Date(/^\d{4}-\d{2}-\d{2}$/.test(String(value)) ? `${value}T00:00:00` : value)

/** Local calendar day of a timestamp — the key the itinerary groups on. */
function localDay(value) {
 const d = toDate(value)
 const pad = (n) => String(n).padStart(2, '0')
 return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`
}

const dateLabel = (v) => (v ? dtf({ day: 'numeric', month: 'short', year: 'numeric' }).format(toDate(v)) : '')
const dayLabel = (v) => (v ? dtf({ weekday: 'short', day: 'numeric', month: 'short' }).format(toDate(v)) : '')
const timeLabel = (v) => (v ? dtf({ hour: 'numeric', minute: '2-digit' }).format(toDate(v)) : '')

function dateRange(start, end) {
 if (!start && !end) return 'Dates not set yet'
 if (!end) return dateLabel(start)
 const sameYear = toDate(start).getFullYear() === toDate(end).getFullYear()
 const left = sameYear ? dtf({ day: 'numeric', month: 'short' }).format(toDate(start)) : dateLabel(start)
 return `${left} – ${dateLabel(end)}`
}

function relativeTime(value) {
 const mins = Math.round((Date.now() - new Date(value).getTime()) / 60000)
 if (mins < 1) return 'just now'
 if (mins < 60) return `${mins}m ago`
 const hours = Math.round(mins / 60)
 if (hours < 24) return `${hours}h ago`
 const days = Math.round(hours / 24)
 return days < 7 ? `${days}d ago` : dateLabel(value)
}

/** upcoming | live | past — drives badges and the History page. */
function tripPhase(trip) {
 const today = new Date().toISOString().slice(0, 10)
 if (trip.status === 'done') return 'past'
 if (trip.end_date && trip.end_date < today) return 'past'
 if (trip.start_date && trip.start_date > today) return 'upcoming'
 return 'live'
}

function countdown(trip) {
 if (!trip.start_date) return null
 const days = Math.ceil((toDate(trip.start_date) - new Date()) / 86400000)
 if (days > 1) return `in ${days} days`
 if (days === 1) return 'tomorrow'
 if (days === 0) return 'today'
 return null
}

function tripLengthDays(trip) {
 if (!trip.start_date || !trip.end_date) return 0
 return Math.max(1, Math.round((toDate(trip.end_date) - toDate(trip.start_date)) / 86400000) + 1)
}

/** Group timestamped rows into ordered day buckets. */
function groupByDay(items, key = 'start_time') {
 const buckets = new Map()
 for (const item of items) {
   const day = localDay(item[key])
   if (!buckets.has(day)) buckets.set(day, [])
   buckets.get(day).push(item)
 }
 return [...buckets.entries()]
   .sort(([a], [b]) => a.localeCompare(b))
   .map(([day, rows]) => ({ day, rows: rows.sort((a, b) => String(a[key]).localeCompare(String(b[key]))) }))
}

const nameOf = (members, id, fallback = 'Former member') =>
 members.find((m) => m.id === id)?.name || fallback

/**
* What to call someone. A saved name wins; otherwise the part of their email
* before the @, so the greeting is never empty. Updating the profile changes
* it everywhere at once.
*/
function displayName(profile, email = '') {
 const saved = (profile?.full_name || '').trim()
 if (saved) return saved
 const fromEmail = String(email).split('@')[0].replace(/[._-]+/g, ' ').trim()
 return fromEmail || 'Traveller'
}

const firstNameOf = (name = '') => name.trim().split(/\s+/)[0] || ''

/**
* An admin can do everything on a trip. 'owner' is still recognised so a
* database mid-upgrade keeps working, but nothing writes it any more.
*/
const isAdmin = (members, me) =>
 ['admin', 'owner'].includes(members.find((m) => m.id === me)?.role)

function initials(name = '') {
 const parts = name.trim().split(/\s+/).slice(0, 2)
 return parts.map((p) => p[0]?.toUpperCase() || '').join('') || '?'
}

/** Deterministic tint so the same person keeps the same colour. */
function avatarTint(id = '') {
 const tints = [
   'bg-brand-wash text-brand-dark',
   'bg-signal-wash text-[#8A5B0E]',
   'bg-alert-wash text-alert',
   'bg-ink/10 text-ink',
   'bg-[#E8EAF6] text-[#3B4A8C]',
 ]
 let n = 0
 for (const ch of id) n += ch.charCodeAt(0)
 return tints[n % tints.length]
}

const CATEGORIES = ['Travel', 'Stay', 'Food', 'Activities', 'Shopping', 'Other']

/**
* Only ever render http(s). A stored 'javascript:' or 'data:' URL would
* execute on click, so anything else becomes an inert '#'. The database has a
* matching constraint; this is the second line, because a row could predate it.
*/
function safeUrl(url) {
 const trimmed = String(url || '').trim()
 return /^https?:\/\/[^\s]+$/i.test(trimmed) ? trimmed : '#'
}

/** A phone number safe to put after tel:. */
function telUrl(phone) {
 const cleaned = String(phone || '').replace(/[^\d+]/g, '')
 return cleaned ? `tel:${cleaned}` : '#'
}

/** "drive.google.com" out of a full URL, for a tidy link row. */
function hostOf(url) {
 try { return new URL(url).hostname.replace(/^www\./, '') } catch { return url }
}

/**
* Where one question round stands.
*
* The asker is asking everyone else, so they are not counted and their own
* replies are ignored: a round waits for headcount - 1 people and packs itself
* once they have all answered. Anyone may wrap it early. Progress counts
* people, not messages, so a chatty answerer cannot finish a round alone.
*
* A round asked when nobody else was on the trip has a target of zero; it
* stays open rather than packing instantly, so it is still there to answer
* once somebody joins.
*/
function roundState(question, answers) {
 const author = question.created_by
 const fromOthers = answers.filter((a) => a.user_id !== author)
 const people = new Set(fromOthers.map((a) => a.user_id))
 const target = Math.max(0, (question.headcount || 1) - 1)
 const answered = people.size
 const everyone = target > 0 && answered >= target
 return {
   answered, target, everyone,
   replies: fromOthers.length,
   waiting: Math.max(0, target - answered),
   pct: target > 0 ? Math.min(100, Math.round((answered / target) * 100)) : 0,
   packed: Boolean(question.closed_at) || everyone,
   reason: question.closed_at ? 'wrapped' : everyone ? 'everyone' : 'open',
 }
}

/**
* Where a group vote stands. Percentages are of everyone on the trip, not of
* whoever happened to vote, so one accept out of five reads as 20% and never
* carries. A verdict needs more than half the group behind it.
*/
function tally(votes, headcount) {
 const accept = votes.filter((v) => v.vote === 'accept').length
 const decline = votes.filter((v) => v.vote === 'decline').length
 const total = Math.max(1, headcount)
 const pct = (k) => Math.round((k / total) * 100)
 const majority = Math.floor(total / 2) + 1
 return {
   accept, decline, headcount: total,
   voted: accept + decline,
   pending: Math.max(0, total - accept - decline),
   acceptPct: pct(accept),
   declinePct: pct(decline),
   majority,
   verdict: accept >= majority ? 'accepted' : decline >= majority ? 'declined' : 'open',
 }
}

const sum = (rows, pick = (r) => r) =>
 round2(rows.reduce((total, row) => total + (Number(pick(row)) || 0), 0))

/**
* What one person's own spending comes to, per category. This is what a
* personal budget is measured against: a 1,200 dinner split three ways adds
* 400 to that person's Food line, not 1,200.
*/
function myShareByCategory(expenses, userId) {
 const out = {}
 for (const c of CATEGORIES) out[c] = 0
 for (const e of expenses) {
   const mine = (e.expense_shares || []).find((s) => s.user_id === userId)
   if (!mine) continue
   const cat = CATEGORIES.includes(e.category) ? e.category : 'Other'
   out[cat] = round2(out[cat] + Number(mine.amount))
 }
 return out
}

/** Split evenly in whole paise; leftover units go to the first few people. */
function splitEqual(total, userIds) {
 const ids = [...userIds]
 if (!ids.length) return []
 const paise = Math.round((Number(total) || 0) * 100)
 const base = Math.floor(paise / ids.length)
 let extra = paise - base * ids.length
 return ids.map((id) => {
   const bonus = extra > 0 ? 1 : 0
   extra -= bonus
   return { user_id: id, amount: (base + bonus) / 100 }
 })
}

/**
* Net position per person: positive means the group owes them.
*
* Anyone who appears in the money is included, not only current members. If
* somebody leaves a trip mid-way their share does not evaporate — it would
* leave the ledger unbalanced and quietly change what everybody else owes.
* The settle-up view labels them as a former member.
*/
function netBalances(expenses, settlements, memberIds) {
 const net = {}
 for (const id of memberIds) net[id] = 0
 const involve = (id) => { if (id && !(id in net)) net[id] = 0 }
 for (const e of expenses) {
   involve(e.paid_by)
   for (const s of e.expense_shares || []) involve(s.user_id)
 }
 for (const s of settlements) { involve(s.from_user); involve(s.to_user) }
 const bump = (id, delta) => { if (id in net) net[id] += delta }
 for (const e of expenses) {
   bump(e.paid_by, Number(e.amount))
   for (const s of e.expense_shares || []) bump(s.user_id, -Number(s.amount))
 }
 for (const s of settlements) {
   bump(s.from_user, Number(s.amount))
   bump(s.to_user, -Number(s.amount))
 }
 for (const id of Object.keys(net)) net[id] = round2(net[id])
 return net
}

/** Fewest transfers that clear the board: biggest debtor meets biggest creditor. */
function settlementPlan(net) {
 const owe = Object.entries(net).filter(([, v]) => v < -0.009)
   .map(([id, v]) => ({ id, amount: -v })).sort((a, b) => b.amount - a.amount)
 const due = Object.entries(net).filter(([, v]) => v > 0.009)
   .map(([id, v]) => ({ id, amount: v })).sort((a, b) => b.amount - a.amount)

 const transfers = []
 let i = 0, j = 0
 while (i < owe.length && j < due.length) {
   const amount = round2(Math.min(owe[i].amount, due[j].amount))
   if (amount > 0.009) transfers.push({ from: owe[i].id, to: due[j].id, amount })
   owe[i].amount = round2(owe[i].amount - amount)
   due[j].amount = round2(due[j].amount - amount)
   if (owe[i].amount <= 0.009) i += 1
   if (due[j].amount <= 0.009) j += 1
 }
 return transfers
}

/* ==========================================================================
  2. Data layer — every read and write in the app goes through `api`
  ========================================================================== */

/**
* Every failure is classified once, here, so the UI can show the right screen
* instead of a raw Postgres string: a denied row, an expired session and a
* dead connection need three different answers.
*/
function classify(error) {
 const msg = String(error?.message || error || '')
 const code = error?.code || ''
 if (/Failed to fetch|NetworkError|network request failed/i.test(msg)) return 'offline'
 if (/JWT|token is expired|not authenticated|Invalid Refresh Token/i.test(msg)) return 'expired'
 if (code === '42501' || code === 'PGRST301' || /row-level security|permission denied/i.test(msg)) {
   return 'denied'
 }
 if (code === 'PGRST116' || /0 rows/i.test(msg)) return 'missing'
 if (code === '23514' || /check constraint/i.test(msg)) return 'invalid'
 if (code === '23505' || /duplicate key/i.test(msg)) return 'duplicate'
 return 'failed'
}

/**
* Anything interested in a failure listens here. Every failed request is
* announced, because most inline actions — ticking a checklist item, voting,
* clearing an RSVP — are fire-and-forget: without this, a refusal or a dropped
* connection would look exactly like success.
*/
const appFault = {
 listeners: new Set(),
 emit(kind, error) { for (const fn of this.listeners) fn(kind, error) },
 watch(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn) },
}

class DataError extends Error {
 constructor(error) {
   const kind = classify(error)
   super(String(error?.message || error || 'Something went wrong'))
   this.kind = kind
   this.code = error?.code || ''
 }
}

async function run(query) {
 let result
 try {
   result = await query
 } catch (networkError) {
   const wrapped = new DataError(networkError)
   appFault.emit(wrapped.kind, wrapped)
   throw wrapped
 }
 if (result.error) {
   const wrapped = new DataError(result.error)
   appFault.emit(wrapped.kind, wrapped)
   throw wrapped
 }
 return result.data
}

const uid = () => sb.auth.getUser().then(({ data }) => data.user?.id ?? null)

const api = {
 // ---- auth -------------------------------------------------------------
 async signUp({ email, password, fullName, phone }) {
   const { data, error } = await sb.auth.signUp({
     email, password, options: { data: { full_name: fullName, phone } },
   })
   if (error) throw new Error(error.message)
   return data
 },
 async signIn({ email, password }) {
   const { data, error } = await sb.auth.signInWithPassword({ email, password })
   if (error) throw new Error(error.message)
   return data
 },
 async sendPasswordReset(email) {
   const clean = String(email || '').trim()
   if (!clean) throw new Error('Enter your email address')
   const { error } = await sb.auth.resetPasswordForEmail(clean, {
     redirectTo: window.location.origin + window.location.pathname,
   })
   if (error) throw new Error(error.message)
 },
 async updatePassword(password) {
   const { data, error } = await sb.auth.updateUser({ password })
   if (error) throw new Error(error.message)
   return data
 },
 async setPushEnabled(enabled) {
   const id = await uid()
   if (!id) return
   const { error } = await sb.from('push_subscriptions')
     .update({ push_enabled: Boolean(enabled) })
     .eq('user_id', id)
   if (error) throw new Error(error.message)
 },
 signOut: () => sb.auth.signOut(),

 async myProfile() {
   const id = await uid()
   if (!id) return null
   return run(sb.from('profiles').select('*').eq('id', id).maybeSingle())
 },
 async saveProfile(patch) {
   const id = await uid()
   return run(sb.from('profiles').update(patch).eq('id', id).select().single())
 },

 // ---- trips ------------------------------------------------------------
 async myTrips() {
   const id = await uid()
   if (!id) return []
   const rows = await run(
     sb.from('trip_members').select('role, joined_at, trips(*)')
       .eq('user_id', id).order('joined_at', { ascending: false })
   )
   return rows.filter((r) => r.trips).map((r) => ({ ...r.trips, myRole: r.role }))
 },
 createTrip: ({ name, destination, startDate, endDate, budget, currency }) =>
   run(sb.rpc('create_trip', {
     p_name: name, p_destination: destination || '', p_start: startDate || null,
     p_end: endDate || null, p_budget: Number(budget) || 0, p_currency: currency || 'INR',
   })),
 joinTrip: (code) => run(sb.rpc('join_trip', { p_code: code })),
 leaveTrip: (tripId) => run(sb.rpc('leave_trip', { p_trip: tripId })),
 trip: (tripId) => run(sb.from('trips').select('*').eq('id', tripId).single()),
 saveTrip: (tripId, patch) => run(sb.from('trips').update(patch).eq('id', tripId).select().single()),

 async members(tripId) {
   const rows = await run(
     sb.from('trip_members')
       .select('user_id, role, joined_at, budget, seen, profiles(full_name, phone)')
       .eq('trip_id', tripId).order('joined_at')
   )
   return rows.map((r) => ({
     id: r.user_id,
     role: r.role,
     budget: Number(r.budget) || 0,
     seen: r.seen || {},
     joinedAt: r.joined_at,
     name: r.profiles?.full_name || 'Traveller',
     phone: r.profiles?.phone || '',
   }))
 },

 // ---- generic trip-scoped CRUD ----------------------------------------
 list: (table, tripId, { select = '*', column = 'created_at', ascending = false } = {}) =>
   run(sb.from(table).select(select).eq('trip_id', tripId).order(column, { ascending })),

 /** Stamps created_by on the tables that track an author. */
 async insert(table, row) {
   const tracksAuthor = !['attendance', 'member_locations', 'budget_lines',
                          'posts', 'post_replies'].includes(table)
   const payload = tracksAuthor && !('created_by' in row) ? { ...row, created_by: await uid() } : row
   return run(sb.from(table).insert(payload).select().single())
 },
 update: (table, id, patch) => run(sb.from(table).update(patch).eq('id', id).select().single()),
 remove: (table, id) => run(sb.from(table).delete().eq('id', id)),

 // ---- features needing more than plain CRUD ---------------------------
 polls: (tripId) => api.list('polls', tripId, { select: '*, poll_votes(user_id, option_index)' }),

 async vote(pollId, optionIndex) {
   const id = await uid()
   return run(sb.from('poll_votes').upsert(
     { poll_id: pollId, user_id: id, option_index: optionIndex },
     { onConflict: 'poll_id,user_id' }
   ))
 },

 /** Passing the same answer twice clears it, so an RSVP can be undone. */
 async rsvp(tripId, itemId, status) {
   const id = await uid()
   if (!status) {
     return run(sb.from('attendance').delete().eq('item_id', itemId).eq('user_id', id))
   }
   return run(sb.from('attendance').upsert(
     { trip_id: tripId, item_id: itemId, user_id: id, status, updated_at: new Date().toISOString() },
     { onConflict: 'item_id,user_id' }
   ))
 },

 suggestions: (tripId) =>
   api.list('suggestions', tripId, { select: '*, suggestion_votes(user_id, vote)' }),

 /** A suggestion always belongs to a stop. */
 suggest: (tripId, itemId, body) =>
   api.insert('suggestions', { trip_id: tripId, item_id: itemId, body }),

 /** Accept or decline a suggestion; the same answer again withdraws it. */
 async voteSuggestion(tripId, suggestionId, vote) {
   const id = await uid()
   if (!vote) {
     return run(sb.from('suggestion_votes').delete()
       .eq('suggestion_id', suggestionId).eq('user_id', id))
   }
   return run(sb.from('suggestion_votes').upsert(
     { trip_id: tripId, suggestion_id: suggestionId, user_id: id, vote, voted_at: new Date().toISOString() },
     { onConflict: 'suggestion_id,user_id' }
   ))
 },

 /** Owner or admin only; enforced in SQL, not just here. */
 setMemberRole: (tripId, userId, role) =>
   run(sb.rpc('set_member_role', { p_trip: tripId, p_user: userId, p_role: role })),

 /** The board: notices and questions in one feed, replies embedded. */
 posts: (tripId) =>
   api.list('posts', tripId, { select: '*, post_replies(id, user_id, body, created_at)' }),

 /** headcount is snapshotted so a later joiner cannot un-pack a round. */
 async post({ tripId, kind, title, body, state, pinned, headcount }) {
   const id = await uid()
   return run(sb.from('posts').insert({
     trip_id: tripId,
     kind,
     title: title || '',
     body,
     state: state || 'ok',
     pinned: Boolean(pinned),
     headcount: Math.max(1, headcount || 1),
     created_by: id,
   }).select().single())
 },

 async reply(tripId, postId, body) {
   const id = await uid()
   return run(sb.from('post_replies')
     .insert({ trip_id: tripId, post_id: postId, user_id: id, body })
     .select().single())
 },

 /** Any member may wrap a round early; the RPC checks membership. */
 wrapPost: (postId, wrapped) =>
   run(sb.rpc('wrap_post', { p_post: postId, p_wrapped: wrapped })),

 links: (tripId) => api.list('trip_links', tripId),

 /** Latest activity per area in one round trip, for the unread badges. */
 activity: (tripId) => run(sb.rpc('trip_activity', { p_trip: tripId })),

 markSeen: (tripId, area) => run(sb.rpc('mark_seen', { p_trip: tripId, p_area: area })),

 expenses: (tripId) =>
   api.list('expenses', tripId, { select: '*, expense_shares(user_id, amount)', column: 'spent_on' }),

 addExpense: ({ tripId, description, amount, category, paidBy, spentOn, shares }) =>
   run(sb.rpc('add_expense', {
     p_trip: tripId, p_description: description, p_amount: Number(amount),
     p_category: category, p_paid_by: paidBy, p_spent_on: spentOn, p_shares: shares,
   })),

 /** Budget lines belong to one person, so they carry user_id. */
 async saveBudgetLine(tripId, category, planned) {
   const id = await uid()
   return run(sb.from('budget_lines')
     .upsert({ trip_id: tripId, user_id: id, category, planned: Number(planned) || 0 },
             { onConflict: 'trip_id,user_id,category' })
     .select().single())
 },

 /** Each member sets their own overall budget for the trip. */
 async setMyBudget(tripId, amount) {
   const id = await uid()
   return run(sb.from('trip_members')
     .update({ budget: Number(amount) || 0 })
     .eq('trip_id', tripId).eq('user_id', id).select().single())
 },

 /** Ticks are personal: a row exists only for the member who ticked. */
 async toggleCheck(tripId, itemId, on) {
   const id = await uid()
   if (!on) {
     return run(sb.from('checklist_checks').delete().eq('item_id', itemId).eq('user_id', id))
   }
   return run(sb.from('checklist_checks').upsert(
     { trip_id: tripId, item_id: itemId, user_id: id, checked_at: new Date().toISOString() },
     { onConflict: 'item_id,user_id' }
   ))
 },

 /**
  * Ticking a stop off moves it to the completed plan. This goes through an
  * RPC, not a direct update: stop_update restricts edits to the stop's
  * author, but completing one is something any member on the trip can do.
  */
 completeStop: (itemId, done) =>
   run(sb.rpc('complete_stop', { p_item: itemId, p_done: done })),

 /** Permanent: every itinerary, expense and message for the trip goes too. */
 deleteTrip: (tripId) => run(sb.from('trips').delete().eq('id', tripId)),

 async shareLocation(tripId, { lat, lng, accuracy }) {
   const id = await uid()
   return run(sb.from('member_locations').upsert(
     { trip_id: tripId, user_id: id, lat, lng, accuracy: accuracy ?? null, updated_at: new Date().toISOString() },
     { onConflict: 'trip_id,user_id' }
   ))
 },
 async stopSharingLocation(tripId) {
   const id = await uid()
   return run(sb.from('member_locations').delete().eq('trip_id', tripId).eq('user_id', id))
 },

 /** One channel per trip: any change re-runs the open tab's queries. */
 subscribeTrip(tripId, onChange) {
   const tables = [
     'itinerary_items', 'suggestions', 'attendance', 'polls', 'poll_votes',
     'posts', 'post_replies', 'trip_links',
     'checklist_items', 'checklist_checks', 'suggestion_votes', 'emergency_contacts',
     'budget_lines', 'expenses', 'expense_shares', 'settlements',
     'member_locations', 'trip_members',
   ]
   const channel = sb.channel(`trip:${tripId}`)
   for (const table of tables) {
     channel.on('postgres_changes', { event: '*', schema: 'public', table }, onChange)
   }
   channel.subscribe()
   return () => sb.removeChannel(channel)
 },
}

/**
* A quiet line at the foot of the screen for failures nothing else reports.
* Expiry has its own screen, so it is skipped here.
*/
function FaultToast() {
 const [fault, setFault] = useState(null)
 useEffect(() => appFault.watch((kind, error) => {
   if (kind === 'expired') return
   setFault({ kind, text: FRIENDLY[kind] || String(error?.message || 'Something went wrong') })
 }), [])
 useEffect(() => {
   if (!fault) return
   const t = setTimeout(() => setFault(null), 6000)
   return () => clearTimeout(t)
 }, [fault])

 if (!fault) return null
 return ReactDOM.createPortal(
   <div className="pointer-events-none fixed inset-x-0 bottom-0 z-[70] flex justify-center p-4">
     <div role="status"
       className="pointer-events-auto flex max-w-md items-start gap-3 rounded-lg border border-alert/25 bg-white px-3.5 py-2.5 text-[13px] text-ink shadow-lift">
       <span className="mt-0.5 h-1.5 w-1.5 shrink-0 rounded-full bg-alert" aria-hidden="true" />
       <span className="flex-1">{fault.text}</span>
       <button type="button" className="shrink-0 text-slate-550 hover:text-ink"
         onClick={() => setFault(null)} aria-label="Dismiss">✕</button>
     </div>
   </div>,
   document.body
 )
}

/** True while the browser reports no connection. */
function useOnline() {
 const [online, setOnline] = useState(
   typeof navigator === 'undefined' ? true : navigator.onLine !== false
 )
 useEffect(() => {
   const up = () => setOnline(true)
   const down = () => setOnline(false)
   window.addEventListener('online', up)
   window.addEventListener('offline', down)
   return () => { window.removeEventListener('online', up); window.removeEventListener('offline', down) }
 }, [])
 return online
}

 )
}

/**
* Bottom sheet on phones, centred dialog on bigger screens.
*
* Rendered through a portal on purpose: the sticky header uses backdrop-blur,
* and backdrop-filter creates a containing block, so a fixed-position sheet
* opened from the account menu would anchor to the header and get clipped
* instead of covering the viewport.
*/
function Sheet({ open, title, onClose, children }) {
 useEffect(() => {
   if (!open) return
   const onKey = (e) => e.key === 'Escape' && onClose()
   document.addEventListener('keydown', onKey)
   document.body.style.overflow = 'hidden'
   return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = '' }
 }, [open, onClose])

 if (!open) return null
 return ReactDOM.createPortal(
   <div className="fixed inset-0 z-[60] flex items-end justify-center sm:items-center">
     <button type="button" aria-label="Close" className="absolute inset-0 bg-ink/40" onClick={onClose} />
     <div className="relative max-h-[92vh] w-full max-w-lg overflow-hidden rounded-t-xl bg-white shadow-lift sm:rounded-xl">
       <header className="flex items-center justify-between border-b border-line px-4 py-3">
         <h2 className="text-[17px] font-semibold">{title}</h2>
         <button type="button" className="btn btn-quiet btn-sm -mr-2" onClick={onClose}>Close</button>
       </header>
       <div className="max-h-[calc(92vh-56px)] overflow-y-auto px-4 py-4">{children}</div>
     </div>
   </div>,
   document.body
 )
}

/**
* The tab icon and title come from BRAND too, so switching the mark or
* renaming the app updates the browser tab with everything else.
*/
function applyBrandToTab() {
 const mark = MARKS[BRAND.mark] || MARKS.route
 const svg = mark.favicon.replace(/\s+/g, ' ').trim()
 let link = document.querySelector('link#favicon')
 if (!link) {
   link = document.createElement('link')
   link.id = 'favicon'
   link.rel = 'icon'
   document.head.appendChild(link)
 }
 link.type = 'image/svg+xml'
 link.href = 'data:image/svg+xml,' + encodeURIComponent(svg)
 document.title = `${BRAND.wordmark} — ${BRAND.tagline}`
}

/** Which service a pasted URL belongs to. */
function serviceFor(url) {
 const host = hostOf(url)
 return SERVICES.find((svc) => svc.match.test(host)) || GENERIC_SERVICE
}

function Logo({ className, showWord = true, tone = 'text-ink' }) {

/** The link that carries an invite code straight into the app. */
function joinLink(code) {
 const { origin, pathname } = window.location
 return `${origin}${pathname}#/join/${code}`
}

/**
* Share sheet on a phone, clipboard everywhere else. navigator.share only
* exists in a secure context on mobile, so the copy buttons are not a
* fallback for failure — they are the desktop path.
*/
function InviteShare({ trip }) {
 const [copied, setCopied] = useState('')
 const canShare = typeof navigator !== 'undefined' && typeof navigator.share === 'function'
 const link = joinLink(trip.code)
 const message =
   `Join my trip "${trip.name}" on TripSync.\n\nCode: ${trip.code}\n${link}`

 async function copy(what, text) {
   try {
     await navigator.clipboard.writeText(text)
     setCopied(what)
     setTimeout(() => setCopied(''), 1800)
   } catch {
     setCopied('')
   }
 }

 return (
   <div>
     <div className="flex flex-wrap items-center gap-3">
       <span className="num rounded-lg border border-dashed border-line bg-paper px-4 py-2.5 font-display text-2xl font-bold tracking-[0.25em]">
         {trip.code}
       </span>
       <div className="flex flex-wrap gap-2">
         {canShare && (
           <button type="button" className="btn btn-primary btn-sm"
             onClick={() => navigator.share({
               title: `${trip.name} on ${BRAND.wordmark}`,
               text: message,
             }).catch(() => {})}>
             Share invite
           </button>
         )}
         <button type="button" className="btn btn-ghost btn-sm" onClick={() => copy('code', trip.code)}>
           {copied === 'code' ? 'Code copied' : 'Copy code'}
         </button>
         <button type="button" className="btn btn-ghost btn-sm" onClick={() => copy('link', link)}>
           {copied === 'link' ? 'Link copied' : 'Copy link'}
         </button>
       </div>
     </div>
     <p className="muted mt-2">
       {canShare
         ? 'Share sends the code and a link straight to WhatsApp, Messages or anywhere else. Tapping the link opens the trip ready to join.'
         : 'Send the link and whoever opens it lands on the join screen with the code already filled in.'}
     </p>
   </div>
 )
}

/**
* Collapsed "add something" form. Fields are plain and named, so each caller
* describes its inputs and this handles open/close, busy and error state.
*/
function AddBlock({ openLabel, cta = 'Add', children }) {
 const [open, setOpen] = useState(false)
 const [state, setState] = useState({ busy: false, error: null })
 const onSubmit = children.props.onSubmit

 if (!open) {
   return (
     <button type="button" className="btn btn-ghost btn-sm w-full sm:w-auto" onClick={() => setOpen(true)}>
       + {openLabel}
     </button>
   )
 }
 return (
   <form
     className="space-y-3 rounded-lg border border-line bg-paper/70 p-3"
     onSubmit={async (e) => {
       e.preventDefault()
       const form = e.currentTarget
       setState({ busy: true, error: null })
       try {
         await onSubmit(Object.fromEntries(new FormData(form).entries()))
         form.reset()
         setState({ busy: false, error: null })
         setOpen(false)
       } catch (err) {
         setState({ busy: false, error: err.message })
       }
     }}
   >
     {children.props.children}
     <ErrorNote error={state.error} />
     <div className="flex gap-2">
       <button type="submit" className="btn btn-brand btn-sm" disabled={state.busy}>
         {state.busy ? 'Saving' : cta}
       </button>
       <button type="button" className="btn btn-quiet btn-sm" onClick={() => setOpen(false)}>Cancel</button>
     </div>
   </form>
 )
}

/** Wraps fields so AddBlock can read them: <Fields onSubmit={fn}>…</Fields> */

/* ==========================================================================
  4. Shell — auth, routing, top bar
  ========================================================================== */

function App() {
 const [session, setSession] = useState(undefined) // undefined while checking
 const [expired, setExpired] = useState(false)
 const [recovering, setRecovering] = useState(() => /(?:^|[&#?])type=recovery(?:&|$)/.test(window.location.hash))
 const route = useHashRoute()
 const online = useOnline()

 useEffect(() => {
   if (!isConfigured) return
   sb.auth.getSession().then(({ data }) => setSession(data.session ?? null))
   const { data } = sb.auth.onAuthStateChange((event, next) => {
     setSession(next)
     if (event === 'PASSWORD_RECOVERY') setRecovering(true)
     if (next) setExpired(false)
     if (event === 'SIGNED_OUT' || event === 'TOKEN_REFRESHED') setExpired(false)
   })
   return () => data.subscription.unsubscribe()
 }, [])

 // Any request that comes back with a dead token raises the session screen.
 useEffect(() => appFault.watch((kind) => { if (kind === 'expired') setExpired(true) }), [])

 if (!isConfigured) return <SetupNotice />
 if (recovering) return <RecoveryScreen />
 if (session === undefined) return <BootScreen label="Checking your session" />
 if (!session) return <AuthScreen />

 if (expired) {
   return (
     <div className="min-h-screen">
       <StateScreen kind="expired"
         title="Your session has expired"
         detail="For safety, sessions don't last forever. Sign in again and you'll come straight back to your trips."
         action="Sign in again"
         onAction={async () => { await api.signOut(); setExpired(false) }} />
     </div>
   )
 }

 const tripMatch = route.match(/^\/trip\/([0-9a-f-]+)/i)
 const joinMatch = route.match(/^\/join\/([A-Za-z0-9]{4,8})/)

 return (
   <div className="min-h-screen">
     <TopBar session={session} route={route} />
     {!online && (
       <div className="border-b border-signal/40 bg-signal-wash px-4 py-2 text-center text-[13px] text-[#8A5B0E]"
         role="status">
         You're offline. Nothing will save until the connection is back.
       </div>
     )}
     <main className="mx-auto w-full max-w-app px-4 pb-10 pt-5 sm:px-6">
       {tripMatch ? <TripPage tripId={tripMatch[1]} userId={session.user.id} online={online} />
         : joinMatch ? <JoinByLink code={joinMatch[1].toUpperCase()} />
         : route.startsWith('/history') ? <HistoryPage userId={session.user.id} />
         : <Dashboard userId={session.user.id} email={session.user.email || ''} online={online} />}
     </main>
     <SiteFooter />
     <FaultToast />
   </div>
 )
}

function AuthScreen() {
 const [mode, setMode] = useState('in') // in | up | forgot
 const [form, setForm] = useState({ email: '', password: '', fullName: '', phone: '' })
 const [state, setState] = useState({ busy: false, error: null, notice: null })
 const [shown, setShown] = useState(false)
 const [touched, setTouched] = useState({})
 const set = (key) => (e) => setForm({ ...form, [key]: e.target.value })
 const blur = (key) => () => setTouched({ ...touched, [key]: true })

 const problems = mode === 'forgot'
   ? {
       email: !form.email.trim()
         ? 'An email address is needed'
         : !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(form.email.trim())
           ? "That doesn't look like an email address"
           : '',
     }
   : {
       fullName: mode === 'up' && !form.fullName.trim() ? 'Tell the group what to call you' : '',
       email: !form.email.trim()
         ? 'An email address is needed'
         : !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(form.email.trim())
           ? "That doesn't look like an email address"
           : '',
       password: !form.password
         ? 'A password is needed'
         : form.password.length < 6
           ? 'Six characters or more'
           : '',
     }
 const showProblem = (key) => (touched[key] ? problems[key] : '')
 const blocked = Object.values(problems).some(Boolean)

 function switchMode(next) {
   setMode(next)
   setState({ busy: false, error: null, notice: null })
   setTouched({})
   setShown(false)
 }

 async function submit(e) {
   e.preventDefault()
   if (blocked) {
     setTouched(Object.fromEntries(Object.keys(problems).map((k) => [k, true])))
     setState({ busy: false, error: null, notice: null })
     return
   }
   setState({ busy: true, error: null, notice: null })
   try {
     if (mode === 'forgot') {
       await api.sendPasswordReset(form.email)
       setState({
         busy: false,
         error: null,
         notice: 'If an account uses that email, a password reset link has been sent. Check your inbox and spam folder.',
       })
       return
     }
     if (mode === 'in') {
       await api.signIn(form)
     } else {
       const result = await api.signUp(form)
       if (!result.session) {
         setState({ busy: false, error: null, notice: 'Check your inbox to confirm the address, then sign in.' })
         return
       }
     }
     go('/')
   } catch (err) {
     setState({ busy: false, error: err.message, notice: null })
   }
 }

 const title = mode === 'forgot' ? 'Reset your password' : 'Everyone knows the plan before anyone packs.'

 return (
   <div className="flex min-h-screen flex-col">
   <div className="mx-auto grid w-full max-w-app flex-1 items-center gap-10 px-4 py-10 sm:px-6 lg:grid-cols-[1.05fr_minmax(0,380px)] lg:gap-16">

       <Logo className="text-[19px]" />
       <h1 className="mt-7 max-w-[19ch] text-[34px] font-bold leading-[1.08] sm:text-5xl">
         {title}
       </h1>
       <p className="mt-4 max-w-[54ch] text-[15px] leading-relaxed text-slate-550">
         Build the itinerary together, vote on the calls nobody can make, tick off the shared
         list, and keep the money straight — one code for the whole group.
       </p>
       <div className="mt-9 max-w-md">
         <div className="stub overflow-hidden">
           <div className="flex items-baseline justify-between border-b border-line px-4 py-2.5">
             <span className="font-display text-sm font-bold">Goa · Saturday</span>
             <span className="chip">4 going</span>
           </div>
           <ol className="divide-y divide-line">
             {[
               ['06:40', 'Cab to the airport', 'Mahesh has the booking'],
               ['11:15', 'Check in at Anjuna', 'Two rooms, three nights'],
               ['18:30', 'Sunset at Chapora', 'happening now'],
             ].map(([time, itemTitle, note], i) => (
               <li key={time} className="flex gap-3 px-4 py-3">
                 <span className="num w-12 shrink-0 pt-0.5 text-[13px] font-medium text-slate-550">{time}</span>
                 <span className="relative flex w-3 shrink-0 justify-center">
                   <span className="absolute inset-y-0 w-px bg-line" />
                   <span className={cls('relative mt-1.5 h-2 w-2 rounded-full ring-2 ring-white', i === 2 ? 'bg-signal' : 'bg-ink/25')} />
                 </span>
                 <span className="min-w-0">
                   <span className="block truncate text-sm font-medium">{itemTitle}</span>
                   <span className={cls('block text-xs', i === 2 ? 'text-signal' : 'text-slate-550')}>{note}</span>
                 </span>
               </li>
             ))}
           </ol>
         </div>
       </div>
     </div>

     <form onSubmit={submit} className="card p-5 sm:p-6">
       {mode !== 'forgot' && (
         <div className="flex gap-1 rounded-md bg-paper p-1">
           {[['in', 'Sign in'], ['up', 'Create account']].map(([key, label]) => (
             <button key={key} type="button" onClick={() => switchMode(key)}
               className={cls('h-8 flex-1 rounded text-[13px] font-medium transition-colors',
                 mode === key ? 'bg-white text-ink shadow-card' : 'text-slate-550')}>{label}</button>
           ))}
         </div>
       )}

       <div className="mt-5 space-y-3">
         {mode === 'forgot' ? (
           <>
             <div>
               <label className="label" htmlFor="au-reset-email">Email</label>
               <input id="au-reset-email" type="email" autoComplete="email" inputMode="email"
                 className={cls('field', showProblem('email') && 'border-alert')}
                 value={form.email} onChange={set('email')} onBlur={blur('email')}
                 aria-invalid={Boolean(showProblem('email'))} aria-describedby="au-reset-email-err" />
               <FieldError id="au-reset-email-err" message={showProblem('email')} />
             </div>
             <ErrorNote error={state.error} />
             {state.notice && (
               <p className="rounded-md border border-brand/25 bg-brand-wash px-3 py-2 text-[13px] text-brand-dark">{state.notice}</p>
             )}
             <button type="submit" className="btn btn-brand w-full" disabled={state.busy}>
               {state.busy ? 'Sending reset link' : 'Send reset link'}
             </button>
             <button type="button" className="btn btn-quiet w-full" onClick={() => switchMode('in')}>
               Back to sign in
             </button>
           </>
         ) : (

function RecoveryScreen() {

/** The one thing a group checks mid-trip: what's next, and who's in. */
function NextUp({ trip }) {
 const data = useAsync(async () => {
   const [items, members] = await Promise.all([
     api.list('itinerary_items', trip.id, { column: 'start_time', ascending: true }),
     api.members(trip.id),
   ])
   return { items, members }
 }, [trip.id])

 const all = data.data?.items || []
 const members = data.data?.members || []
 // A stop the group has ticked off is done, whatever the clock says.
 const items = all.filter((i) => !i.completed_at)
 const done = all.length - items.length
 const now = Date.now()
 const current = items.find((i) => new Date(i.start_time) <= now && i.end_time && new Date(i.end_time) >= now)
 const next = items.find((i) => new Date(i.start_time) > now)
 const item = current || next || items[0]

 return (
   <section className="card overflow-hidden">
     <div className="flex flex-wrap items-center justify-between gap-2 border-b border-line px-4 py-2.5 sm:px-5">
       <a href={`#/trip/${trip.id}`} className="font-display text-sm font-bold hover:underline">{trip.name}</a>
       <div className="flex items-center gap-2">
         <div className="flex -space-x-1.5">
           {members.slice(0, 5).map((m) => (
             <span key={m.id} className="rounded-full ring-2 ring-white"><Avatar name={m.name} id={m.id} size="sm" /></span>
           ))}
         </div>
         {members.length > 5 && <span className="muted">+{members.length - 5}</span>}
       </div>
     </div>

     <div className="px-4 py-4 sm:px-5">
       {data.loading && <Loading label="Checking the plan" />}
       {!data.loading && !item && (
         <div className="flex flex-wrap items-center justify-between gap-3">
           <p className="text-sm text-slate-550">
             {done > 0
               ? `Every stop is ticked off — ${done} done.`
               : 'Nothing on the timeline yet.'}
           </p>
           <button type="button" className="btn btn-ghost btn-sm" onClick={() => go(`/trip/${trip.id}`)}>
             {done > 0 ? 'Add another stop' : 'Add the first stop'}
           </button>
         </div>
       )}
       {item && (
         <div className="flex items-start gap-4">
           <div className="shrink-0">
             <p className="num font-display text-[28px] font-bold leading-none">{timeLabel(item.start_time)}</p>
             <p className="muted mt-1">{dayLabel(item.start_time)}</p>
           </div>
           <div className="min-w-0 border-l border-line pl-4">
             <p className="text-[11px] font-medium uppercase tracking-wide text-signal">
               {current ? 'Happening now' : 'Up next'}
             </p>
             <p className="mt-0.5 font-display text-[18px] font-bold leading-snug">{item.title}</p>
             {item.location && <p className="muted mt-0.5">{item.location}</p>}
             {item.description && <p className="mt-1.5 text-sm leading-relaxed">{item.description}</p>}
             {done > 0 && <p className="muted mt-1.5">{done} stop{done > 1 ? 's' : ''} already ticked off</p>}
           </div>
         </div>
       )}
     </div>
   </section>
 )
}

/* ==========================================================================
  6. Trip page — every feature behind a tab
  ========================================================================== */

const TABS = [
 ['plan', 'Plan'], ['polls', 'Decisions'], ['board', 'Board'], ['list', 'Checklist'],
 ['money', 'Money'], ['safety', 'Safety'], ['crew', 'Crew'],
]
const TAB_LABEL = Object.fromEntries(TABS)

// Which activity keys count as news for each tab.
const TAB_AREAS = {
 plan: ['plan', 'plan_notes'],
 board: ['board', 'board_replies', 'links'],
 polls: ['polls'],
 list: ['list'],
 money: ['money'],
 safety: ['safety'],
 crew: ['crew'],
}

function TripPage({ tripId, userId }) {
 const [tab, setTab] = useState('plan')
 const [version, setVersion] = useState(0)
 const [alertsOn, setAlertsOn] = useState(() => localStorage.getItem(`tripsync-alerts:${userId}`) !== 'off')
 const [alertBusy, setAlertBusy] = useState(false)

 // One realtime channel for the whole trip: any change re-runs the open tab's
 // queries, so every member sees the same board without a refresh.
 useEffect(() => api.subscribeTrip(tripId, () => setVersion((v) => v + 1)), [tripId])

 const base = useAsync(async () => {
   const [trip, members] = await Promise.all([api.trip(tripId), api.members(tripId)])
   return { trip, members }
 }, [tripId, version])

 // One call returns the latest activity per area; comparing it with this
 // member's own "seen" map badges every tab, not just the board.
 const activity = useAsync(() => api.activity(tripId), [tripId, version])
 const seen = base.data?.members.find((m) => m.id === userId)?.seen || {}
 const fresh = activity.data || {}
 const unreadFor = (area) => {
   const areas = TAB_AREAS[area] || [area]
   return areas.some((key) => fresh[key] && (!seen[area] || fresh[key] > seen[area]))
 }

 // Foreground browser alerts are controlled by the header toggle.
 const alerted = useRef(null)
 useEffect(() => {
   if (!alertsOn || typeof Notification === 'undefined' || Notification.permission !== 'granted') return
   const signature = JSON.stringify(fresh)
   if (alerted.current === null) { alerted.current = signature; return }
   if (alerted.current === signature) return
   alerted.current = signature
   const areas = TABS.map(([key]) => key).filter(unreadFor)
   if (!areas.length) return
   try {
     new Notification(base.data?.trip?.name || 'TripSync', {
       body: `New activity in ${areas.map((a) => TAB_LABEL[a]).join(', ')}`,
       tag: `${tripId}-activity`,
     })
   } catch { /* some browsers only allow this from a service worker */ }
 }, [JSON.stringify(fresh), alertsOn])

 async function toggleAlerts() {
   if (alertBusy) return
   setAlertBusy(true)
   try {
     if (alertsOn) {
       setAlertsOn(false)
       localStorage.setItem(`tripsync-alerts:${userId}`, 'off')
       try { await api.setPushEnabled(false) } catch {}
       return
     }
     if (typeof Notification === 'undefined') throw new Error('This browser does not support notifications')
     if (Notification.permission === 'denied') throw new Error('Notifications are blocked for this site. Allow them in your browser settings first.')
     if (Notification.permission !== 'granted') {
       const permission = await Notification.requestPermission()
       if (permission !== 'granted') return
     }
     setAlertsOn(true)
     localStorage.setItem(`tripsync-alerts:${userId}`, 'on')
     try { await api.setPushEnabled(true) } catch {}
   } catch (err) {
     window.alert(err.message || String(err))
   } finally {
     setAlertBusy(false)
   }
 }

 // Opening a tab marks that area read.
 useEffect(() => {
   if (!base.data || !unreadFor(tab)) return
   let alive = true
   api.markSeen(tripId, tab).then(() => { if (alive) base.reload() }).catch(() => {})
   return () => { alive = false }
   // eslint-disable-next-line react-hooks/exhaustive-deps
 }, [tab, JSON.stringify(fresh), Boolean(base.data)])

 if (base.loading && !base.data) return <StateScreen kind="loading" title="Opening the trip" />
 if (base.error) {
   const kind = base.error.kind || 'failed'
   const copy = {
     denied: ['You\u2019re not on this trip',
       "Only members can open it. Ask whoever organised it for the invite code, then join from your trips page."],
     missing: ['This trip is gone', 'It looks like the organiser deleted it.'],
     offline: ["Can\u2019t reach the trip", 'You appear to be offline. Reconnect and try again.'],
     expired: ['Your session has expired', 'Sign in again to carry on.'],
     failed: ["Couldn\u2019t open the trip", String(base.error.message || base.error)],
   }[kind]
   return (
     <StateScreen kind={kind} title={copy[0]} detail={copy[1]}
       action={kind === 'denied' || kind === 'missing' ? 'Back to trips' : 'Try again'}
       onAction={() => (kind === 'denied' || kind === 'missing' ? go('/') : base.reload())} />
   )
 }

 const { trip, members } = base.data

const ITEM_KINDS = [['travel', 'Travel'], ['stay', 'Stay'], ['activity', 'Activity'], ['food', 'Food']]

function PlanTab({ trip, members, me, version }) {
 const items = useAsync(() => api.list('itinerary_items', trip.id, { column: 'start_time', ascending: true }), [trip.id, version])
 const rsvps = useAsync(() => api.list('attendance', trip.id, { column: 'updated_at' }), [trip.id, version])
 const notes = useAsync(() => api.suggestions(trip.id), [trip.id, version])
 const admin = isAdmin(members, me)

 const rows = items.data || []
 const active = rows.filter((r) => !r.completed_at)
 const finished = rows.filter((r) => r.completed_at)
   .sort((a, b) => String(b.completed_at).localeCompare(String(a.completed_at)))
 const days = groupByDay(active)
 const now = Date.now()
 const onTheRoad = tripPhase(trip) === 'live'
 const defaultDay = trip.start_date || new Date().toISOString().slice(0, 10)

 async function addItem(v) {
   if (!v.title?.trim()) throw new Error('Give the stop a name')
   if (!v.start_time) throw new Error('Pick a start time')
   await api.insert('itinerary_items', {
     trip_id: trip.id, title: v.title.trim(), description: (v.description || '').trim(),
     location: (v.location || '').trim(), category: v.category,
     start_time: new Date(v.start_time).toISOString(),
     end_time: v.end_time ? new Date(v.end_time).toISOString() : null,
   })
   items.reload()
 }

 return (
   <div className="space-y-4">
     <Panel title="Itinerary"
       subtitle={rows.length
         ? `${active.length} still to go${finished.length ? `, ${finished.length} done` : ''} · anyone can add a stop`
         : 'Build the plan together — anyone can add a stop'}>
       <div className="mb-4">
         <AddBlock openLabel="Add a stop" cta="Add stop">
           <Fields onSubmit={addItem}>
             <div>
               <label className="label" htmlFor="it-title">What's happening</label>
               <input id="it-title" name="title" className="field" required maxLength={200} placeholder="Ferry to Divar" />
             </div>
             <div className="grid gap-3 sm:grid-cols-2">
               <div>
                 <label className="label" htmlFor="it-start">Starts</label>
                 <input id="it-start" name="start_time" type="datetime-local" className="field" required defaultValue={`${defaultDay}T09:00`} />
               </div>
               <div>
                 <label className="label" htmlFor="it-end">Ends (optional)</label>
                 <input id="it-end" name="end_time" type="datetime-local" className="field" />
               </div>
             </div>
             <div className="grid gap-3 sm:grid-cols-[1fr_140px]">
               <div>
                 <label className="label" htmlFor="it-loc">Where</label>
                 <input id="it-loc" name="location" className="field" placeholder="Old Ferry Wharf" />
               </div>
               <div>
                 <label className="label" htmlFor="it-cat">Kind</label>
                 <select id="it-cat" name="category" className="field" defaultValue="activity">
                   {ITEM_KINDS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                 </select>
               </div>
             </div>
             <div>
               <label className="label" htmlFor="it-desc">Details the group needs</label>
               <textarea id="it-desc" name="description" className="field" placeholder="Tickets at the counter, carry cash" />
             </div>
           </Fields>
         </AddBlock>
       </div>

       {items.loading && !rows.length && <Loading label="Loading the plan" />}
       <ErrorNote error={items.error} onRetry={items.reload} />
       {!items.loading && rows.length > 0 && !active.length && (
         <Empty title="Every stop is ticked off" hint="Nice. Add another, or look back over the completed plan below." />
       )}
       {!items.loading && !rows.length && (
         <Empty title="The timeline is empty" hint="Add the first stop — flights, check-in, dinner, anything the group needs to know." />
       )}

       <div className="space-y-5">
         {days.map(({ day, rows: dayRows }) => (
           <div key={day}>
             <div className="mb-2 flex items-center gap-3">
               <h3 className="font-display text-sm font-bold">{dayLabel(day)}</h3>
               <span className="rule flex-1" />
             </div>
             <ol className="space-y-2">
               {dayRows.map((item) => (
                 <ItineraryRow key={item.id} item={item} trip={trip} members={members} me={me}
                   admin={admin} onTheRoad={onTheRoad}
                   live={new Date(item.start_time).getTime() <= now && item.end_time && new Date(item.end_time).getTime() >= now}
                   rsvps={(rsvps.data || []).filter((r) => r.item_id === item.id)}
                   notes={(notes.data || []).filter((n) => n.item_id === item.id)}
                   onChange={() => { items.reload(); rsvps.reload(); notes.reload() }} />
               ))}
             </ol>
           </div>
         ))}
       </div>
     </Panel>

     {finished.length > 0 && (
       <CompletedPlan trip={trip} members={members} rows={finished} onChange={items.reload} />
     )}
   </div>
 )
}

/** Local datetime-local value for an existing timestamp. */
function localInput(value) {
 if (!value) return ''
 const d = new Date(value)
 const pad = (x) => String(x).padStart(2, '0')
 return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`
}

/**
* Editing a stop is how an accepted suggestion actually takes effect: the
* author (or an organiser) changes the details the group agreed on.
*/
function EditStopSheet({ open, item, onClose, onDone }) {
 const [form, setForm] = useState(null)
 const [state, setState] = useState({ busy: false, error: null })

 useEffect(() => {
   if (!open) return
   setForm({
     title: item.title,
     description: item.description || '',
     location: item.location || '',
     category: item.category || 'activity',
     start_time: localInput(item.start_time),
     end_time: localInput(item.end_time),
   })
   setState({ busy: false, error: null })
 }, [open, item])

 const set = (key) => (e) => setForm({ ...form, [key]: e.target.value })

 return (
   <Sheet open={open && Boolean(form)} title="Edit this stop" onClose={onClose}>
     {form && (
       <form className="space-y-3"
         onSubmit={async (e) => {
           e.preventDefault()
           setState({ busy: true, error: null })
           try {
             if (!form.start_time) throw new Error('A stop needs a start time')
             await api.update('itinerary_items', item.id, {
               title: form.title,
               description: form.description,
               location: form.location,
               category: form.category,
               start_time: new Date(form.start_time).toISOString(),
               end_time: form.end_time ? new Date(form.end_time).toISOString() : null,
             })
             onDone()
           } catch (err) {
             setState({ busy: false, error: err.message })
           }
         }}>
         <div>
           <label className="label" htmlFor="ed-title">What's happening</label>
           <input id="ed-title" className="field" required value={form.title} onChange={set('title')} />
         </div>
         <div className="grid gap-3 sm:grid-cols-2">
           <div>
             <label className="label" htmlFor="ed-start">Starts</label>
             <input id="ed-start" type="datetime-local" className="field" required
               value={form.start_time} onChange={set('start_time')} />
           </div>
           <div>
             <label className="label" htmlFor="ed-end">Ends (optional)</label>
             <input id="ed-end" type="datetime-local" className="field"
               value={form.end_time} onChange={set('end_time')} />
           </div>
         </div>
         <div className="grid gap-3 sm:grid-cols-[1fr_140px]">
           <div>
             <label className="label" htmlFor="ed-loc">Where</label>
             <input id="ed-loc" className="field" value={form.location} onChange={set('location')} />
           </div>
           <div>
             <label className="label" htmlFor="ed-cat">Kind</label>
             <select id="ed-cat" className="field" value={form.category} onChange={set('category')}>
               {ITEM_KINDS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
             </select>
           </div>
         </div>
         <div>
           <label className="label" htmlFor="ed-desc">Details the group needs</label>
           <textarea id="ed-desc" className="field" value={form.description} onChange={set('description')} />
         </div>
         <ErrorNote error={state.error} />
         <button type="submit" className="btn btn-brand w-full" disabled={state.busy}>
           {state.busy ? 'Saving' : 'Save changes'}
         </button>
       </form>
     )}
   </Sheet>
 )
}

/** Accept/decline split as a single bar, so the standing reads at a glance. */
function VoteBar({ t }) {
 return (
   <div className="mt-2">
     <div className="flex h-1.5 overflow-hidden rounded-full bg-paper">
       <div className="bg-brand transition-[width]" style={{ width: `${t.acceptPct}%` }} />
       <div className="bg-alert/70 transition-[width]" style={{ width: `${t.declinePct}%` }} />
     </div>
     <div className="muted mt-1 flex flex-wrap items-center gap-x-3">
       <span className="num">
         <span className="font-medium text-brand-dark">{t.acceptPct}% for</span>
         {' · '}
         <span className="font-medium text-alert">{t.declinePct}% against</span>
       </span>
       <span className="num">{t.accept + t.decline} of {t.headcount} voted</span>

const VERDICT = {
 accepted: ['Group accepted', 'chip chip-on'],
 declined: ['Group declined', 'chip border-alert/30 bg-alert-wash text-alert'],
 open: ['Still open', 'chip'],
}

/**
* A suggestion the whole group votes on. The verdict needs more than half of
* everyone on the trip, so one voice out of five never decides it.
*/
function SuggestionRow({ note, trip, members, me, admin, itemAuthor, onChange }) {
 const [editing, setEditing] = useState(false)
 const [draft, setDraft] = useState(note.body)
 const votes = note.suggestion_votes || []
 const t = tally(votes, members.length)
 const mine = votes.find((v) => v.user_id === me)?.vote
 const canEdit = note.created_by === me || admin
 const canDelete = canEdit || itemAuthor === me
 const [label, chipCls] = VERDICT[t.verdict]

 return (
   <div className="rounded-md bg-paper px-3 py-2.5">
     <div className="flex items-start gap-2">
       <Avatar name={nameOf(members, note.created_by)} id={note.created_by} size="sm" />
       <div className="min-w-0 flex-1">
         {editing ? (
           <div className="space-y-2">
             <textarea className="field" value={draft} onChange={(e) => setDraft(e.target.value)} />
             <div className="flex gap-2">
               <button type="button" className="btn btn-brand btn-sm"
                 onClick={async () => {
                   if (!draft.trim()) return
                   await api.update('suggestions', note.id, { body: draft.trim() })
                   setEditing(false)
                   onChange()
                 }}>Save</button>
               <button type="button" className="btn btn-quiet btn-sm"
                 onClick={() => { setDraft(note.body); setEditing(false) }}>Cancel</button>
             </div>
           </div>
         ) : (
           <>
             <p className="text-sm leading-relaxed">{note.body}</p>
             <p className="muted mt-0.5">
               {nameOf(members, note.created_by)} · {relativeTime(note.created_at)}
             </p>
           </>
         )}
       </div>
       <span className={cls('shrink-0', chipCls)}>{label}</span>
     </div>

     {!editing && (
       <>
         <VoteBar t={t} />
         <div className="mt-2 flex flex-wrap items-center gap-1.5">
           <button type="button" className={cls('chip', mine === 'accept' && 'chip-on')}
             title={mine === 'accept' ? 'Click again to withdraw your vote' : undefined}
             onClick={async () => {
               await api.voteSuggestion(trip.id, note.id, mine === 'accept' ? null : 'accept')
               onChange()
             }}>
             Accept{mine === 'accept' ? ' ✕' : ''}
           </button>
           <button type="button"
             className={cls('chip', mine === 'decline' && 'border-alert/30 bg-alert-wash text-alert')}
             title={mine === 'decline' ? 'Click again to withdraw your vote' : undefined}
             onClick={async () => {
               await api.voteSuggestion(trip.id, note.id, mine === 'decline' ? null : 'decline')
               onChange()
             }}>
             Decline{mine === 'decline' ? ' ✕' : ''}
           </button>
           {t.pending > 0 && (
             <span className="muted">
               waiting on {t.pending} {t.pending === 1 ? 'person' : 'people'}
             </span>
           )}
           {canEdit && !editing && (
             <button type="button" className="chip ml-auto" onClick={() => setEditing(true)}>Edit</button>
           )}
           {canDelete && (
             <button type="button" className={cls('chip', canEdit ? '' : 'ml-auto')}
               onClick={async () => { await api.remove('suggestions', note.id); onChange() }}>
               Delete
             </button>
           )}
         </div>
         {t.verdict === 'accepted' && note.item_id && itemAuthor && (
           <p className="muted mt-2">
             The group agreed. {itemAuthor === me ? 'Use Edit on the stop above to apply it.' : `${nameOf(members, itemAuthor)} can now edit the stop to apply it.`}
           </p>
         )}
       </>
     )}
   </div>
 )
}

             show_voters: v.show_voters === 'on',

         }}>

               className="mt-0.5 h-4 w-4 rounded border-line text-brand focus:ring-brand" />

         </Fields>
       </AddBlock>

     {polls.loading && !rows.length && <Loading label="Loading polls" />}

       <Empty title="Nothing to vote on" hint="Start a poll when the group needs to pick between options." />
