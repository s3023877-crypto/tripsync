     <div className="space-y-3">
       {rows.map((poll) => {
         const votes = poll.poll_votes || []
         const mine = votes.find((v) => v.user_id === me)?.option_index
         const leader = Math.max(0, ...poll.options.map((_, i) => votes.filter((v) => v.option_index === i).length))
         return (
           <article key={poll.id} className="stub p-3 sm:p-4">
             <div className="flex items-start justify-between gap-2">
               <h4 className="font-display text-[15px] font-bold leading-snug">{poll.question}</h4>
               {poll.created_by === me && (
                 <div className="flex shrink-0 items-center gap-1">
                   <button type="button" className="chip"
                     onClick={async () => { await api.update('polls', poll.id, { show_voters: !poll.show_voters }); polls.reload() }}>
                     {poll.show_voters ? 'Hide names' : 'Show names'}
                   </button>
                   <button type="button" className="chip"
                     onClick={async () => { await api.update('polls', poll.id, { closed: !poll.closed }); polls.reload() }}>
                     {poll.closed ? 'Reopen' : 'Close'}
                   </button>
                   <IconButton label="Delete poll" onClick={async () => { await api.remove('polls', poll.id); polls.reload() }} />
                 </div>
               )}
             </div>
             <p className="muted mt-0.5">
               {votes.length} of {members.length} voted{poll.closed ? ' · closed' : ''}
               {poll.show_voters ? '' : ' · anonymous'}
               {votes.length < members.length && !poll.closed
                 ? ` · waiting on ${members.length - votes.length}`
                 : ''}
             </p>

             {votes.length > 0 && (
               <p className="muted mt-1">
                 Leading option has {Math.round((leader / Math.max(1, members.length)) * 100)}% of the group behind it
                 {leader > members.length / 2 ? ' — a clear majority' : ' — not yet a majority'}.
               </p>
             )}
             <ul className="mt-3 space-y-1.5">
               {poll.options.map((option, index) => {
                 const count = votes.filter((v) => v.option_index === index).length
                 // Share of everyone on the trip, so a single vote out of six
                 // reads as 17% rather than a misleading 100%.
                 const pct = Math.round((count / Math.max(1, members.length)) * 100)
                 const winning = count > 0 && count === leader
                 return (
                   <li key={index}>
                     <button type="button" disabled={poll.closed}
                       onClick={async () => { await api.vote(poll.id, index); polls.reload() }}
                       className={cls('relative block w-full overflow-hidden rounded-md border px-3 py-2 text-left transition-colors',
                         mine === index ? 'border-brand/50' : 'border-line',
                         poll.closed ? 'cursor-default' : 'hover:border-ink/30')}>
                       <span className={cls('absolute inset-y-0 left-0 transition-[width]', winning ? 'bg-signal-wash' : 'bg-paper')} style={{ width: `${pct}%` }} />
                       <span className="relative flex items-center justify-between gap-3">
                         <span className="min-w-0 text-sm font-medium">
                           {option}{mine === index && <span className="text-brand"> · your vote</span>}
                           {poll.show_voters && count > 0 && (
                             <span className="muted mt-0.5 block truncate font-normal">
                               {votes.filter((v) => v.option_index === index)
                                 .map((v) => nameOf(members, v.user_id)).join(', ')}
                             </span>
                           )}
                         </span>
                         <span className="shrink-0 text-right">
                           <span className={cls('num block text-[13px] font-medium', winning ? 'text-ink' : 'text-slate-550')}>
                             {pct}%
                           </span>
                           <span className="num block text-[11px] text-slate-550">
                             {count} {count === 1 ? 'vote' : 'votes'}
                           </span>
                         </span>
                       </span>
                     </button>
                   </li>
                 )
               })}
             </ul>
           </article>
         )
       })}
     </div>
   </Panel>
 )
}

/* ============================ THE BOARD ==================================
  One feed. A notice is something to read; a question also gathers replies and
  tracks who has not answered. Both accept replies, so nothing needed a third
  mechanism — this replaced separate announcement, question and status feeds.
  ========================================================================= */

const STATES = [['ok', 'All good'], ['delayed', 'Running late'], ['arrived', 'Arrived'], ['help', 'Need help']]

function BoardTab({ trip, members, me, version }) {
 const feed = useAsync(() => api.posts(trip.id), [trip.id, version])
 const admin = isAdmin(members, me)
 const rows = feed.data || []

 // Pinned notices first, then newest. A packed question drops below the live
 // ones but stays in the timeline.
 const sorted = [...rows].sort((a, b) => {
   const aPacked = a.kind === 'question' && roundState(a, a.post_replies || []).packed
   const bPacked = b.kind === 'question' && roundState(b, b.post_replies || []).packed
   if (aPacked !== bPacked) return aPacked ? 1 : -1
   if (a.pinned !== b.pinned) return a.pinned ? -1 : 1
   return String(b.created_at).localeCompare(String(a.created_at))
 })

 const open = rows.filter(
   (p) => p.kind === 'question' && !roundState(p, p.post_replies || []).packed
 ).length

 return (
   <div className="space-y-4">
     <Panel title="Board"
       subtitle={rows.length
         ? `${rows.length} post${rows.length > 1 ? 's' : ''}${open ? ` · ${open} question${open > 1 ? 's' : ''} waiting on answers` : ''}`
         : 'Notices the group must read, and questions that gather answers'}>
       <Composer trip={trip} members={members} onDone={feed.reload} />

       {feed.loading && !rows.length && <Loading label="Loading the board" />}
       <ErrorNote error={feed.error} onRetry={feed.reload} />
       {!feed.loading && !rows.length && (
         <Empty title="Nothing on the board"
           hint="Post a notice everyone must read, or ask the group something and collect their answers." />
       )}

       <div className="space-y-2.5">
         {sorted.map((post) => (
           <PostCard key={post.id} post={post} trip={trip} members={members}
             me={me} admin={admin} onChange={feed.reload} />
         ))}
       </div>
     </Panel>

   </div>
 )
}

/** One composer for both kinds of post. */
function Composer({ trip, members, onDone }) {
 const [kind, setKind] = useState('notice')
 const [form, setForm] = useState({ title: '', body: '', state: 'ok', pinned: false })
 const [state, setState] = useState({ busy: false, error: null })
 const set = (key) => (e) =>
   setForm({ ...form, [key]: e.target.type === 'checkbox' ? e.target.checked : e.target.value })

 async function submit(e) {
   e.preventDefault()
   if (!form.body.trim()) {
     setState({ busy: false, error: 'Type something first' })
     return
   }
   setState({ busy: true, error: null })
   try {
     await api.post({
       tripId: trip.id,
       kind,
       title: kind === 'notice' ? form.title : '',
       body: form.body.trim(),
       state: kind === 'notice' ? form.state : 'ok',
       pinned: kind === 'notice' && form.pinned,
       headcount: members.length,
     })
     setForm({ title: '', body: '', state: 'ok', pinned: false })
     setState({ busy: false, error: null })
     onDone()
   } catch (err) {
     setState({ busy: false, error: err })
   }
 }

 return (
   <form onSubmit={submit} className="mb-4 rounded-lg border border-line bg-paper/70 p-3">
     <div className="mb-3 flex gap-1 rounded-md bg-white p-1 shadow-card">
       {[['notice', 'Notice'], ['question', 'Question']].map(([key, label]) => (
         <button key={key} type="button" onClick={() => setKind(key)}
           className={cls('h-8 flex-1 rounded text-[13px] font-medium transition-colors',
             kind === key ? 'bg-ink text-white' : 'text-slate-550 hover:text-ink')}>
           {label}
         </button>
       ))}
     </div>

     {kind === 'notice' && (
       <div className="mb-2">
         <label className="label" htmlFor="bd-title">Headline (optional)</label>
         <input id="bd-title" className="field" maxLength={200} placeholder="Cab leaves at 6.40 sharp"
           value={form.title} onChange={set('title')} />
       </div>
     )}

     <div>
       <label className="label" htmlFor="bd-body">
         {kind === 'notice' ? 'What everyone should know' : 'Your question'}
       </label>
       <textarea id="bd-body" className="field" maxLength={4000} value={form.body} onChange={set('body')}
         placeholder={kind === 'notice'
           ? 'Meet in the lobby with bags packed.'
           : "Who's in for breakfast at 8, and where do we meet?"} />
       {kind === 'question' && (
         <p className="muted mt-1">
           {members.length > 1
             ? `Goes to the other ${members.length - 1} on the trip and closes itself once they've all answered. You don't answer your own question.`
             : "Nobody else has joined yet, so it'll wait for them."}
         </p>
       )}
     </div>

     {kind === 'notice' && (
       <div className="mt-2 flex flex-wrap items-center gap-3">
         <select className="field h-8 w-40 text-[13px]" value={form.state} onChange={set('state')}
           aria-label="How things are">
           {STATES.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
         </select>
         <label className="flex items-center gap-2 text-sm">
           <input type="checkbox" checked={form.pinned} onChange={set('pinned')}
             className="h-4 w-4 rounded border-line text-brand focus:ring-brand" />
           Keep at the top
         </label>
       </div>
     )}

     <ErrorNote error={state.error} />
     <button type="submit" className="btn btn-brand btn-sm mt-3" disabled={state.busy}>
       {state.busy ? 'Posting' : kind === 'notice' ? 'Post notice' : 'Ask the group'}
     </button>
   </form>
 )
}

function PostCard({ post, trip, members, me, admin, onChange }) {
 const replies = (post.post_replies || []).slice()
   .sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)))
 const isQuestion = post.kind === 'question'
 const st = isQuestion ? roundState(post, replies) : null
 const packed = Boolean(st?.packed)
 const [expanded, setExpanded] = useState(!packed)
 const [draft, setDraft] = useState('')
 const [busy, setBusy] = useState(false)
 const mine = post.created_by === me
 const canManage = mine || admin
 // You never reply to your own question; a notice you posted is fine to add to.
 const canReply = !(isQuestion && mine)
 const yetToAnswer = isQuestion
   ? members.filter((m) => m.id !== post.created_by && !replies.some((r) => r.user_id === m.id))
   : []

 async function send(e) {
   e.preventDefault()
   if (!draft.trim()) return
   setBusy(true)
   try {
     await api.reply(trip.id, post.id, draft.trim())
     setDraft('')
     onChange()
   } finally {
     setBusy(false)
   }
 }

 if (packed && !expanded) {
   return (
     <div className="rounded-md border border-line bg-paper/60">
       <button type="button" className="flex w-full items-center gap-2.5 px-3 py-2 text-left"
         onClick={() => setExpanded(true)} aria-expanded="false">
         <span className="flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-brand-wash text-[11px] font-semibold text-brand-dark">✓</span>
         <span className="min-w-0 flex-1">
           <span className="block truncate text-sm font-medium">{post.body}</span>
           <span className="muted num block">
             {st.replies} {st.replies === 1 ? 'answer' : 'answers'} from {st.answered} of {st.target}
             {' · '}
             {st.reason === 'wrapped'
             ? `wrapped ${relativeTime(post.closed_at)}${post.closed_by ? ` by ${firstNameOf(nameOf(members, post.closed_by))}` : ''}`
             : 'everyone answered'}
           </span>
         </span>
         <span className="muted shrink-0">Open</span>
       </button>
     </div>
   )
 }

 return (
   <article className={cls('stub overflow-hidden', post.pinned && !isQuestion && 'border-signal/50 bg-signal-wash/30')}>
     <header className="px-3 py-2.5 sm:px-4">
       <div className="flex items-start gap-2.5">
         <Avatar name={nameOf(members, post.created_by)} id={post.created_by} size="sm" />
         <div className="min-w-0 flex-1">
           {post.title && <p className="font-display text-[15px] font-bold leading-snug">{post.title}</p>}
           <p className={cls('leading-relaxed', post.title ? 'mt-0.5 text-sm' : 'font-display text-[15px] font-bold')}>
             {post.body}
           </p>
           <p className="muted mt-1 flex flex-wrap items-center gap-x-2">
             <span className="chip">{isQuestion ? 'Question' : 'Notice'}</span>
             {!isQuestion && post.state !== 'ok' && (
               <span className="flex items-center gap-1.5">
                 <span className={cls('h-1.5 w-1.5 rounded-full',
                   post.state === 'help' ? 'bg-alert' : post.state === 'delayed' ? 'bg-signal' : 'bg-brand')} />
                 {STATES.find(([v]) => v === post.state)?.[1]}
               </span>
             )}
             <span>{nameOf(members, post.created_by)} · {relativeTime(post.created_at)}</span>
           </p>
         </div>
         <div className="flex shrink-0 items-center gap-1">
           {post.pinned && !isQuestion && <span className="chip">Pinned</span>}
           {canManage && !isQuestion && (
             <button type="button" className="chip"
               onClick={async () => { await api.update('posts', post.id, { pinned: !post.pinned }); onChange() }}>
               {post.pinned ? 'Unpin' : 'Pin'}
             </button>
           )}
           {canManage && (
             <IconButton label="Delete post"
               onClick={async () => { await api.remove('posts', post.id); onChange() }} />
           )}
         </div>
       </div>

       {isQuestion && (
         <div className="mt-2.5">
           <div className="h-1.5 overflow-hidden rounded-full bg-paper">
             <div className="h-full bg-brand transition-[width]" style={{ width: `${st.pct}%` }} />
           </div>
           <div className="muted mt-1 flex flex-wrap items-center gap-x-3">
             <span className="num font-medium text-ink">
               {st.target > 0 ? `${st.answered} of ${st.target} answered` : 'nobody else on the trip yet'}
             </span>
             {st.waiting > 0 && (
               <span className="truncate">
                 waiting on {yetToAnswer.slice(0, 3).map((m) => firstNameOf(m.name)).join(', ')}
                 {yetToAnswer.length > 3 ? ` +${yetToAnswer.length - 3}` : ''}
               </span>
             )}
           </div>
         </div>
       )}
     </header>

     {replies.length > 0 && (
       <ul className="divide-y divide-line border-t border-line">
         {replies.map((r) => (
           <li key={r.id} className="flex items-start gap-2.5 px-3 py-2.5 sm:px-4">
             <Avatar name={nameOf(members, r.user_id)} id={r.user_id} size="sm" />
             <div className="min-w-0 flex-1">
               <p className="text-sm leading-relaxed">{r.body}</p>
               <p className="muted mt-0.5">{nameOf(members, r.user_id)} · {relativeTime(r.created_at)}</p>
             </div>
             {(r.user_id === me || admin) && (
               <IconButton label="Delete reply"
                 onClick={async () => { await api.remove('post_replies', r.id); onChange() }} />
             )}
           </li>
         ))}
       </ul>
     )}

     <div className="border-t border-line px-3 py-2.5 sm:px-4">
       {canReply ? (
         <form className="flex flex-col gap-2 sm:flex-row" onSubmit={send}>
           <input className="field sm:flex-1" value={draft} onChange={(e) => setDraft(e.target.value)}
             placeholder={isQuestion ? 'Your answer' : 'Add a reply'}
             aria-label={`Reply to: ${post.body}`} />
           <button type="submit" className="btn btn-brand" disabled={busy || !draft.trim()}>
             {isQuestion ? 'Answer' : 'Reply'}
           </button>
         </form>
       ) : (
         <p className="muted">
           You asked this, so there's nothing for you to answer.
           {st && st.waiting > 0 ? ` Waiting on ${st.waiting} ${st.waiting === 1 ? 'person' : 'people'}.` : ''}
         </p>
       )}

       {isQuestion && (
         <div className="mt-2 flex flex-wrap items-center gap-2">
           <button type="button" className="chip"
             onClick={async () => { await api.wrapPost(post.id, !post.closed_at); onChange() }}>
             {post.closed_at ? 'Reopen round' : 'Wrap up now'}
           </button>
           <span className="muted">
             {st.target === 0
               ? 'Nobody else has joined yet — it stays open.'
               : st.waiting > 0
                 ? `Closes itself once the other ${st.target} have answered.`
                 : 'Everyone has answered.'}
           </span>
           {packed && (
             <button type="button" className="chip ml-auto" onClick={() => setExpanded(false)}>Collapse</button>
           )}
         </div>
       )}
     </div>
   </article>
 )
}

/** Shared albums and folders — a link, not an upload. */
function SharedLinksSheet({ open, onClose, trip, members, me }) {
 const links = useAsync(() => api.links(trip.id), [trip.id, open])
 const rows = links.data || []
 const [editing, setEditing] = useState(false)
 const [error, setError] = useState(null)
 const [busy, setBusy] = useState(false)
 const [form, setForm] = useState({ title: '', url: '' })
 const admin = isAdmin(members, me)

 useEffect(() => {
   if (!open) return
   setEditing(false)
   setError(null)
 }, [open])

 function beginAdd() {
   setForm({ title: '', url: '' })
   setError(null)
   setEditing(true)
 }
 function beginEdit(link) {
   setForm({ title: link.title || '', url: link.url || '' })
   setError(null)
   setEditing(true)
 }
 async function save(e) {
   e.preventDefault()
   const url = form.url.trim()
   if (!/^https?:\/\/[^\s]+$/i.test(url)) {
     setError('Paste the full link, starting with https://')
     return
   }
   setBusy(true); setError(null)
   try {
     if (rows[0]) {
       await api.update('trip_links', rows[0].id, { title: form.title.trim() || 'Shared link', url })
     } else {
       await api.insert('trip_links', { trip_id: trip.id, title: form.title.trim() || 'Shared link', url })
     }
     await links.reload()
     setEditing(false)
   } catch (err) {
     setError(err.message || String(err))
   } finally { setBusy(false) }
 }
 async function remove(link) {
   if (!window.confirm(`Remove “${link.title}” from this trip?`)) return
   try { await api.remove('trip_links', link.id); links.reload() } catch (err) { setError(err.message || String(err)) }
 }

 return (
   <Sheet open={open} title="Shared link" onClose={onClose}>
     <div className="space-y-3">
       {!editing && rows.length > 0 && (
         <>
           {rows.slice(0, 3).map((link) => {
             const svc = serviceFor(link.url)
             return (
               <div key={link.id} className="rounded-lg border border-line bg-paper/60 p-3">
                 <div className="flex items-center gap-3">
                   <span className="grid h-9 w-9 shrink-0 place-items-center rounded-md border border-line bg-white text-slate-550">
                     <svc.Mark />
                   </span>
                   <div className="min-w-0 flex-1">
                     <p className="truncate text-sm font-medium">{link.title || 'Shared link'}</p>
                     <p className="muted truncate">{hostOf(link.url)} · added by {nameOf(members, link.created_by)}</p>
                   </div>
                 </div>
                 <div className="mt-3 flex gap-2">
                   <a className="btn btn-brand btn-sm flex-1" href={safeUrl(link.url)} target="_blank" rel="noreferrer">Open link ↗</a>
                   {(link.created_by === me || admin) && (
                     <>
                       <button type="button" className="btn btn-ghost btn-sm" onClick={() => beginEdit(link)}>Edit</button>
                       <button type="button" className="btn btn-ghost btn-sm" onClick={() => remove(link)}>Remove</button>
                     </>
                   )}
                 </div>
               </div>
             )
           })}
           {rows.length > 3 && <p className="muted">Showing the first 3 shared links.</p>}
         </>
       )}

       {!editing && !rows.length && (
         <Empty title="No shared link yet" hint="Add a Drive, OneDrive, booking, photo album or any other web link for the trip." />
       )}

       {!editing && (
         <button type="button" className="btn btn-brand w-full" onClick={rows.length ? () => beginEdit(rows[0]) : beginAdd}>
           {rows.length ? 'Edit shared link' : '+ Add shared link'}
         </button>
       )}

       {editing && (
         <form onSubmit={save} className="space-y-3">
           <div>
             <label className="label" htmlFor="shared-link-title">Title</label>
             <input id="shared-link-title" className="field" maxLength={120} value={form.title}
               onChange={(e) => setForm({ ...form, title: e.target.value })} placeholder="Trip photos" />
           </div>
           <div>
             <label className="label" htmlFor="shared-link-url">Link</label>
             <input id="shared-link-url" className="field" type="url" required value={form.url}
               onChange={(e) => setForm({ ...form, url: e.target.value })} placeholder="https://..." />
           </div>
           <ErrorNote error={error} />
           <div className="flex gap-2">
             <button type="submit" className="btn btn-brand flex-1" disabled={busy}>{busy ? 'Saving' : 'Save link'}</button>
             <button type="button" className="btn btn-ghost" onClick={() => setEditing(false)}>Cancel</button>
           </div>
         </form>
       )}
     </div>
   </Sheet>
 )
}

/* ------------------------------------------------------------- checklist -- *//* ------------------------------------------------------------- checklist -- */

/**
* Two lists in one tab. The shared list is what the group should remember;
* the private one is only ever visible to its author, enforced by the
* checklist_read policy rather than by hiding rows in the UI.
*
* Ticking is personal either way, so one person packing their bag does not
* clear the item for everybody else.
*/
function ChecklistTab({ trip, members, me, version }) {
 const list = useAsync(() => api.list('checklist_items', trip.id, { column: 'created_at', ascending: true }), [trip.id, version])
 const checks = useAsync(() => api.list('checklist_checks', trip.id, { column: 'checked_at' }), [trip.id, version])
 const [scope, setScope] = useState('shared')
 const [title, setTitle] = useState('')
 const [busy, setBusy] = useState(false)
 const [error, setError] = useState(null)

 const rows = list.data || []
 const allChecks = checks.data || []
 const shared = rows.filter((r) => !r.is_private)
 const privateRows = rows.filter((r) => r.is_private)
 const admin = isAdmin(members, me)

 async function add(e) {
   e.preventDefault()
   if (!title.trim()) {
     setError('Type what to remember first')
     return
   }
   setBusy(true)
   setError(null)
   try {
     await api.insert('checklist_items', {
       trip_id: trip.id, title: title.trim(), is_private: scope === 'private',
     })
     setTitle('')
     list.reload()
   } catch (err) {
     setError(err)
   } finally {
     setBusy(false)
   }
 }

 return (
   <div className="space-y-4">
     <Panel title="Checklist" subtitle="One list for the group, one just for you">
       <form onSubmit={add} className="rounded-lg border border-line bg-paper/70 p-3">
         <div className="mb-3 flex gap-1 rounded-md bg-white p-1 shadow-card">
           {[['shared', 'For everyone'], ['private', 'Just for me']].map(([key, label]) => (
             <button key={key} type="button" onClick={() => setScope(key)}
               className={cls('h-8 flex-1 rounded text-[13px] font-medium transition-colors',
                 scope === key ? 'bg-ink text-white' : 'text-slate-550 hover:text-ink')}>
               {label}
             </button>
           ))}
         </div>
         <div className="flex flex-col gap-2 sm:flex-row">
           <input className="field sm:flex-1" maxLength={200} value={title} onChange={(e) => setTitle(e.target.value)}
             aria-label={scope === 'shared' ? 'Add to the shared list' : 'Add to your private list'}
             placeholder={scope === 'shared' ? 'Power bank and adapters' : 'My passport and travel card'} />
           <button type="submit" className="btn btn-brand" disabled={busy}>
             {busy ? 'Adding' : 'Add'}
           </button>
         </div>
         <p className="muted mt-2">
           {scope === 'shared'
             ? 'Everyone sees this and anyone can add. Ticking it off only marks it for you.'
             : "Only you can see this one — nobody else on the trip knows it's here."}
         </p>
         <ErrorNote error={error} />
       </form>
     </Panel>

     <ChecklistSection
       title="Everyone's list"
       subtitle="What the group should remember — anyone can add"
       rows={shared} checks={allChecks} trip={trip} members={members} me={me} admin={admin}
       onChange={() => { list.reload(); checks.reload() }}
       emptyHint="Add the things that always get forgotten. Everyone sees the same list." />

     <ChecklistSection
       title="Just for me"
       subtitle="Private to you"
       rows={privateRows} checks={allChecks} trip={trip} members={members} me={me} admin={admin}
       onChange={() => { list.reload(); checks.reload() }}
       emptyHint="Your own reminders. Nobody else on the trip can see these." />
   </div>
 )
}

function ChecklistSection({ title, subtitle, rows, checks, trip, members, me, admin, onChange, emptyHint }) {
 const mineDone = rows.filter((r) => checks.some((c) => c.item_id === r.id && c.user_id === me)).length

 return (
   <Panel title={title}
     subtitle={rows.length ? `${mineDone} of ${rows.length} ticked by you` : subtitle}>
     {rows.length > 0 && (
       <div className="mb-3 h-1 overflow-hidden rounded-full bg-paper">
         <div className="h-full bg-brand transition-[width]" style={{ width: `${(mineDone / rows.length) * 100}%` }} />
       </div>
     )}
     {!rows.length && <Empty title="Nothing here yet" hint={emptyHint} />}
     <ul className="divide-y divide-line">
       {rows.map((row) => {
         const rowChecks = checks.filter((c) => c.item_id === row.id)
         const ticked = rowChecks.some((c) => c.user_id === me)
         const others = rowChecks.filter((c) => c.user_id !== me)
         return (
           <li key={row.id} className="flex items-start gap-3 py-2.5">
             <input type="checkbox" checked={ticked}
               aria-label={`Tick ${row.title} for yourself`}
               className="mt-0.5 h-4 w-4 rounded border-line text-brand focus:ring-brand"
               onChange={async () => { await api.toggleCheck(trip.id, row.id, !ticked); onChange() }} />
             <div className="min-w-0 flex-1">
               <p className={cls('text-sm', ticked && 'text-slate-550 line-through')}>{row.title}</p>
               <p className="muted">
                 {row.is_private
                   ? 'private to you'
                   : `added by ${nameOf(members, row.created_by)}`}
                 {others.length ? ` · also ticked by ${others.map((c) => nameOf(members, c.user_id)).join(', ')}` : ''}
               </p>
             </div>
             {/* Matches checklist_delete: the author or an admin, nobody else. */}
             {(row.created_by === me || admin) && (
               <IconButton label={`Remove ${row.title}`}
                 onClick={async () => { await api.remove('checklist_items', row.id); onChange() }} />
             )}
           </li>
         )
       })}
     </ul>
   </Panel>
 )
}

function SafetyTab({ trip, members, me, version }) {
 const contacts = useAsync(() => api.list('emergency_contacts', trip.id), [trip.id, version])
 const spots = useAsync(() => api.list('member_locations', trip.id, { column: 'updated_at' }), [trip.id, version])
 const [geo, setGeo] = useState({ busy: false, error: null })
 const mine = (spots.data || []).find((s) => s.user_id === me)

 async function shareOnce() {
   if (!navigator.geolocation) {
     setGeo({ busy: false, error: 'This device has no location support' })
     return
   }
   setGeo({ busy: true, error: null })
   navigator.geolocation.getCurrentPosition(
     async (pos) => {
       try {
         await api.shareLocation(trip.id, {
           lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy,
         })
         setGeo({ busy: false, error: null })
         spots.reload()
       } catch (e) { setGeo({ busy: false, error: e.message }) }
     },
     (err) => setGeo({ busy: false, error: err.message }),
     { enableHighAccuracy: true, timeout: 12000 }
   )
 }

 return (
   <div className="space-y-4">
     <Panel title="Emergency contacts" subtitle="Whose contact belongs to whom, so nobody has to guess">
       <div className="mb-4">
         <AddBlock openLabel="Add a contact" cta="Save contact">
           <Fields onSubmit={async (v) => {
             if (!v.name?.trim()) throw new Error('Give the contact a name')
             if (!v.phone?.trim()) throw new Error('A phone number is needed')
             await api.insert('emergency_contacts', {
               trip_id: trip.id, for_user: v.for_user || null, name: v.name.trim(),
               relation: (v.relation || '').trim(), phone: v.phone.trim(),
               notes: (v.notes || '').trim(),
             })
             contacts.reload()
           }}>
             <div>
               <label className="label" htmlFor="ec-for">Whose contact is this</label>
               <select id="ec-for" name="for_user" className="field" defaultValue={me}>
                 {members.map((m) => (
                   <option key={m.id} value={m.id}>{m.id === me ? `${m.name} (you)` : m.name}</option>
                 ))}
                 <option value="">Everyone — hotel desk, hospital, police</option>
               </select>
             </div>
             <div className="grid gap-3 sm:grid-cols-2">
               <div>
                 <label className="label" htmlFor="ec-name">Contact name</label>
                 <input id="ec-name" name="name" className="field" required maxLength={120} placeholder="Ramesh Sharma" />
               </div>
               <div>
                 <label className="label" htmlFor="ec-rel">Type</label>
                 <input id="ec-rel" name="relation" className="field"

               </div>
             </div>
             <div>
               <label className="label" htmlFor="ec-phone">Phone</label>
               <input id="ec-phone" name="phone" className="field" required inputMode="tel" maxLength={40} placeholder="+91 98765 43210" />
             </div>
             <div>
               <label className="label" htmlFor="ec-notes">Notes</label>
               <input id="ec-notes" name="notes" className="field" placeholder="Open till 10pm, speaks English" />
             </div>
           </Fields>
         </AddBlock>
       </div>

       {!(contacts.data || []).length && (
         <Empty title="No contacts saved"
           hint="Add your own next of kin so the group can reach them, plus anything trip-wide like a nearby hospital." />
       )}

       {[...members.map((m) => ({ key: m.id, label: `${m.name}${m.id === me ? ' (you)' : ''}`, sub: 'next of kin' })),
         { key: '', label: 'Everyone on the trip', sub: 'hotel desk, hospital, police' }]
         .map((group) => {

             <div key={group.key || 'trip'} className="mb-3 last:mb-0">
               <div className="mb-1.5 flex items-center gap-2">
                 {group.key

                   : <span className="flex h-6 w-6 items-center justify-center rounded-full bg-paper text-[11px]">★</span>}

               </div>
               <ul className="divide-y divide-line rounded-md border border-line">
                 {rows.map((c) => (
                   <li key={c.id} className="flex items-center gap-3 px-3 py-2.5">
                     <div className="min-w-0 flex-1">
                       <p className="text-sm font-medium">
                         {c.name}
                         {c.relation && <span className="font-normal text-slate-550"> · {c.relation}</span>}
                       </p>
                       {c.notes && <p className="muted">{c.notes}</p>}

         )}
       </div>
       <ErrorNote error={geo.error} />

       <ul className="mt-3 divide-y divide-line">
         {(spots.data || []).map((s) => (
           <li key={s.user_id} className="flex items-center gap-3 py-2.5">
             <Avatar name={nameOf(members, s.user_id)} id={s.user_id} size="sm" />
             <div className="min-w-0 flex-1">
               <p className="text-sm font-medium">{nameOf(members, s.user_id)}</p>
               <p className="muted num">{s.lat.toFixed(4)}, {s.lng.toFixed(4)} · {relativeTime(s.updated_at)}</p>
             </div>
             <a className="btn btn-ghost btn-sm" target="_blank" rel="noreferrer"
               href={`https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`}>Open map</a>
           </li>
         ))}
       </ul>
       {!(spots.data || []).length && <p className="muted mt-3">Nobody is sharing a pin right now.</p>}
     </Panel>
   </div>
 )
}

/**
* Alerts cover everything now, not just announcements: a new notice, a
* question, a poll, an expense, anything. While the app is open a granted
* permission raises a browser notification; the dot on each tab is always
* there regardless.
*/
function AlertSettings({ trip }) {
 const [status, setStatus] = useState(
   typeof Notification === 'undefined' ? 'unsupported' : Notification.permission
 )

 return (
   <Panel title="Alerts" subtitle="For anything new on this trip">
     <div className="flex flex-wrap items-center gap-3">
       {status === 'granted' && <span className="chip chip-on">Alerts on</span>}
       {status === 'default' && (
         <button type="button" className="btn btn-ghost btn-sm"
           onClick={async () => setStatus(await Notification.requestPermission())}>
           Turn on alerts
         </button>
       )}
       {status === 'denied' && <span className="chip">Blocked in your browser</span>}
       {status === 'unsupported' && <span className="chip">Not supported here</span>}
     </div>
     <p className="muted mt-2">
       {status === 'granted'
         ? 'You’ll be notified about new notices, questions, polls and expenses while TripSync is open in a tab.'
         : status === 'denied'
           ? 'Unblock notifications for this site in your browser settings to get alerts. Every tab still shows a dot when something is new.'
           : 'Each tab shows a dot when something is new. Turning alerts on also gives you a browser notification while TripSync is open.'}
     </p>
     <p className="muted mt-1.5">
       Waking a closed app needs a push server, which this build deliberately doesn’t have.
     </p>
   </Panel>
 )
}

 const [roleError, setRoleError] = useState(null)
 // One role does everything. trips.created_by only records who started it.
 const canManage = isAdmin(members, me)

 async function changeRole(userId, role) {
   setRoleError(null)
   try {
     await api.setMemberRole(trip.id, userId, role)
     reloadTrip()
   } catch (e) {
     setRoleError(e.message)
   }
 }

 return (
   <div className="space-y-4">
     <Panel title="Invite the group" subtitle="Anyone with this code can join the trip">
       <InviteShare trip={trip} />
     </Panel>


     <Panel title={`Crew · ${members.length}`}
       subtitle={canManage ? 'Admins can do everything on this trip' : 'Everyone on this trip'}>
       <ErrorNote error={roleError} />
       <ul className="divide-y divide-line">
         {members.map((m) => (
           <li key={m.id} className="flex flex-wrap items-center gap-3 py-2.5">

               <select className="field h-8 w-28 text-[13px]"

       {canManage && (
         <p className="muted mt-3">

         </p>
       )}

     <Panel title="Trip settings" subtitle={canManage ? 'Dates, budget and status' : 'Only an admin can change these'}
       action={canManage && (
         <button type="button" className="btn btn-ghost btn-sm"
           onClick={() => setSettings({
             name: trip.name, destination: trip.destination || '',

             budget: trip.budget, status: trip.status,
           })}>Edit</button>
       )}>
       <dl className="grid gap-3 sm:grid-cols-2">
         {[

           ['When', dateRange(trip.start_date, trip.end_date)],
           ['Budget', `${trip.currency} ${Number(trip.budget).toLocaleString()}`],
           ['Status', trip.status],
         ].map(([label, value]) => (
           <div key={label} className="rounded-md bg-paper px-3 py-2">
             <dt className="muted">{label}</dt>
             <dd className="mt-0.5 text-sm font-medium capitalize">{value}</dd>
           </div>
         ))}

             go('/')

         {canManage && trip.status !== 'done' && (

           <button type="button" className="btn btn-ghost btn-sm"

               if (!window.confirm(

               <label className="label" htmlFor="ts-end">Ends</label>
               <input id="ts-end" type="date" className="field" value={settings.end_date}
                 onChange={(e) => setSettings({ ...settings, end_date: e.target.value })} />

             <div>
               <label className="label" htmlFor="ts-budget">Group budget</label>

                 onChange={(e) => setSettings({ ...settings, budget: e.target.value })} />
             </div>
             <div>
               <label className="label" htmlFor="ts-status">Status</label>
               <select id="ts-status" className="field" value={settings.status}
                 onChange={(e) => setSettings({ ...settings, status: e.target.value })}>
                 <option value="planning">Planning</option>
                 <option value="live">On the road</option>
                 <option value="done">Finished</option>
               </select>
             </div>
           </div>
           <button type="submit" className="btn btn-brand w-full">Save changes</button>
         </form>
       )}
     </Sheet>
   </div>
 )
}

  7. Money — budget planner, expenses, splitting, settlement
  ========================================================================== */

const MONEY_VIEWS = [['spend', 'Expenses'], ['budget', 'Budget'], ['settle', 'Settle up']]

function MoneyTab({ trip, members, me, version, reloadTrip }) {
 const [view, setView] = useState('spend')
 const [adding, setAdding] = useState(false)

 const expenses = useAsync(() => api.expenses(trip.id), [trip.id, version])
 const settlements = useAsync(() => api.list('settlements', trip.id), [trip.id, version])
 const budget = useAsync(() => api.list('budget_lines', trip.id, { column: 'category', ascending: true }), [trip.id, version])

 const rows = expenses.data || []
 const paid = settlements.data || []
 const currency = trip.currency

 const totals = useMemo(() => {
   const spent = sum(rows, (r) => r.amount)
   const mineShare = round2(rows.reduce((total, r) =>
     total + Number((r.expense_shares || []).find((s) => s.user_id === me)?.amount || 0), 0))
   const iPaid = sum(rows.filter((r) => r.paid_by === me), (r) => r.amount)
   return { spent, mineShare, iPaid }
 }, [rows, me])

 const net = useMemo(() => netBalances(rows, paid, members.map((m) => m.id)), [rows, paid, members])
 const myNet = net[me] ?? 0
 const myBudget = members.find((m) => m.id === me)?.budget || 0

 return (
   <div className="space-y-4">
     {/* The three numbers a person actually opens this tab for. */}
     <section className="card grid grid-cols-2 divide-line sm:grid-cols-4 sm:divide-x">
       <Stat label="Your share so far" value={money(totals.mineShare, currency)} />
       <Stat
         label={myBudget ? (totals.mineShare > myBudget ? 'Over your budget' : 'Left in your budget') : 'Group spend'}
         value={money(myBudget ? Math.abs(myBudget - totals.mineShare) : totals.spent, currency)}
         tone={!myBudget ? 'flat' : totals.mineShare > myBudget ? 'bad' : 'good'} />
       <Stat label="You paid" value={money(totals.iPaid, currency)} />
       <Stat label={myNet >= 0 ? 'You get back' : 'You owe'} value={money(Math.abs(myNet), currency)}
         tone={Math.abs(myNet) < 0.01 ? 'flat' : myNet > 0 ? 'good' : 'bad'} />
     </section>

     <div className="flex flex-wrap items-center justify-between gap-2">
       <div className="flex gap-1 rounded-md bg-white p-1 shadow-card">
         {MONEY_VIEWS.map(([key, label]) => (
           <button key={key} type="button" onClick={() => setView(key)}
             className={cls('h-8 rounded px-3 text-[13px] font-medium transition-colors',
               view === key ? 'bg-ink text-white' : 'text-slate-550 hover:text-ink')}>{label}</button>
         ))}
       </div>
       <button type="button" className="btn btn-primary btn-sm" onClick={() => setAdding(true)}>Add expense</button>
     </div>

     {expenses.loading && !rows.length && <Loading label="Adding up the money" />}
     <ErrorNote error={expenses.error} onRetry={expenses.reload} />

     {view === 'spend' && (
       <ExpenseList rows={rows} members={members} me={me} currency={currency}
         onChange={expenses.reload} onAdd={() => setAdding(true)} />
     )}
     {view === 'budget' && (
       <BudgetPlanner trip={trip} expenses={rows} me={me}
         myBudget={members.find((m) => m.id === me)?.budget || 0}
         lines={(budget.data || []).filter((l) => l.user_id === me)}
         onChange={budget.reload} onBudgetChange={reloadTrip} />
     )}
     {view === 'settle' && (
       <SettleUp trip={trip} members={members} me={me} net={net} history={paid}
         onChange={() => { settlements.reload(); expenses.reload() }} />
     )}

     <AddExpenseSheet key={members.length} open={adding} trip={trip} members={members} me={me}
       onClose={() => setAdding(false)} onDone={() => { setAdding(false); expenses.reload() }} />
   </div>
 )
}

function Stat({ label, value, tone = 'flat' }) {
 return (
   <div className="px-4 py-3.5">
     <p className="muted">{label}</p>
     <p className={cls('num mt-0.5 font-display text-[19px] font-bold leading-tight',
       tone === 'good' && 'text-brand', tone === 'bad' && 'text-alert')}>{value}</p>
   </div>
 )
}

function ExpenseList({ rows, members, me, currency, onChange, onAdd }) {
 const [openId, setOpenId] = useState(null)

 if (!rows.length) {
   return (
     <Panel>
       <Empty title="No expenses yet" hint="Log what you spend as you go — splitting stays automatic.">
         <button type="button" className="btn btn-brand" onClick={onAdd}>Add the first expense</button>
       </Empty>
     </Panel>
   )
 }

 return (
   <Panel title="Every rupee logged" subtitle={`${rows.length} expense${rows.length > 1 ? 's' : ''}`}>
     <ul className="divide-y divide-line">
       {rows.map((e) => {
         const shares = e.expense_shares || []
         const myShare = shares.find((s) => s.user_id === me)?.amount
         const open = openId === e.id
         return (
           <li key={e.id} className="py-2.5">
             <div className="flex items-start gap-3">
               <Avatar name={nameOf(members, e.paid_by)} id={e.paid_by} size="sm" />
               <button type="button" className="min-w-0 flex-1 text-left" onClick={() => setOpenId(open ? null : e.id)}>
                 <p className="truncate text-sm font-medium">{e.description}</p>
                 <p className="muted">{nameOf(members, e.paid_by)} paid · {e.category} · {dateLabel(e.spent_on)}</p>
               </button>
               <div className="shrink-0 text-right">
                 <p className="num text-sm font-semibold">{money(e.amount, currency)}</p>
                 <p className="muted num">{myShare ? `you ${money(myShare, currency)}` : 'not your share'}</p>
               </div>
               {(e.created_by === me || e.paid_by === me) && (
                 <button type="button" aria-label="Delete expense" className="shrink-0 rounded px-1 text-slate-550 hover:text-alert"
                   onClick={async () => { await api.remove('expenses', e.id); onChange() }}>✕</button>
               )}
             </div>

             {open && (
               <ul className="mt-2 ml-9 space-y-1 border-l border-line pl-3">
                 {shares.map((s) => (
                   <li key={s.user_id} className="flex items-center justify-between gap-3 text-[13px]">
                     <span>{nameOf(members, s.user_id)}</span>
                     <span className="num text-slate-550">{money(s.amount, currency)}</span>
                   </li>
                 ))}
               </ul>
             )}
           </li>
         )
       })}
     </ul>
   </Panel>
 )
}

function AddExpenseSheet({ open, trip, members, me, onClose, onDone }) {
 const ids = members.map((m) => m.id)
 const [form, setForm] = useState({
   description: '', amount: '', category: 'Food', paidBy: me,
   spentOn: new Date().toISOString().slice(0, 10),
 })
 const [included, setIncluded] = useState(ids)
 const [custom, setCustom] = useState(null) // null = split equally
 const [state, setState] = useState({ busy: false, error: null })

 const amount = Number(form.amount) || 0
 const equal = splitEqual(amount, included)
 const shares = custom
   ? included.map((id) => ({ user_id: id, amount: Number(custom[id]) || 0 }))
   : equal
 const shareTotal = sum(shares, (s) => s.amount)
 const off = round2(shareTotal - amount)
 const set = (key) => (e) => setForm({ ...form, [key]: e.target.value })

 const toggleMember = (id) =>
   setIncluded((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]))

 function startCustom() {
   const seed = {}
   for (const s of equal) seed[s.user_id] = s.amount
   setCustom(seed)
 }

 async function submit(e) {
   e.preventDefault()
   setState({ busy: true, error: null })
   try {
     if (!included.length) throw new Error('Pick at least one person to split with')
     if (amount <= 0) throw new Error('Enter an amount above zero')
     if (Math.abs(off) > 0.05) throw new Error(`Shares are off by ${money(off, trip.currency)}`)
     await api.addExpense({
       tripId: trip.id, description: form.description, amount, category: form.category,
       paidBy: form.paidBy, spentOn: form.spentOn, shares,
     })
     setForm({ ...form, description: '', amount: '' })
     setCustom(null)
     setState({ busy: false, error: null })
     onDone()
   } catch (err) {
     setState({ busy: false, error: err.message })
   }
 }

 return (
   <Sheet open={open} title="Add expense" onClose={onClose}>
     <form onSubmit={submit} className="space-y-3">
       <div>
         <label className="label" htmlFor="ex-desc">What was it for</label>
         <input id="ex-desc" className="field" required placeholder="Dinner at the shack" value={form.description} onChange={set('description')} />
       </div>
       <div className="grid grid-cols-2 gap-3">
         <div>
           <label className="label" htmlFor="ex-amt">Amount ({trip.currency})</label>
           <input id="ex-amt" type="number" min="0.01" step="0.01" inputMode="decimal" className="field num"
             required value={form.amount} onChange={set('amount')} />
         </div>
         <div>
           <label className="label" htmlFor="ex-cat">Category</label>
           <select id="ex-cat" className="field" value={form.category} onChange={set('category')}>
             {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
           </select>
         </div>
       </div>
       <div className="grid grid-cols-2 gap-3">
         <div>
           <label className="label" htmlFor="ex-paid">Who paid</label>
           <select id="ex-paid" className="field" value={form.paidBy} onChange={set('paidBy')}>
             {members.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}
           </select>
         </div>
         <div>
           <label className="label" htmlFor="ex-date">When</label>
           <input id="ex-date" type="date" className="field" value={form.spentOn} onChange={set('spentOn')} />
         </div>
       </div>

       <div className="rounded-lg border border-line p-3">
         <div className="flex items-center justify-between gap-2">
           <p className="text-[13px] font-medium">Split between</p>
           <button type="button" className="text-[13px] font-medium text-brand hover:underline"
             onClick={() => (custom ? setCustom(null) : startCustom())}>
             {custom ? 'Split equally' : 'Enter exact amounts'}
           </button>
         </div>

         <ul className="mt-2 space-y-1.5">
           {members.map((m) => {
             const on = included.includes(m.id)
             const value = custom ? custom[m.id] ?? 0 : equal.find((s) => s.user_id === m.id)?.amount ?? 0
             return (
               <li key={m.id} className="flex items-center gap-2.5">
                 <input type="checkbox" checked={on} onChange={() => toggleMember(m.id)}
                   className="h-4 w-4 rounded border-line text-brand focus:ring-brand" />
                 <span className="min-w-0 flex-1 truncate text-sm">{m.name}</span>
                 {custom && on ? (
                   <input type="number" min="0" step="0.01" className="field num h-8 w-28 text-right"
                     value={custom[m.id] ?? ''} onChange={(e) => setCustom({ ...custom, [m.id]: e.target.value })} />
                 ) : (
                   <span className="num text-[13px] text-slate-550">{on ? money(value, trip.currency) : '—'}</span>
                 )}
               </li>
             )
           })}
         </ul>

         {amount > 0 && Math.abs(off) > 0.05 && (
           <p className="mt-2 text-[13px] text-alert">
             Shares add up to {money(shareTotal, trip.currency)} — {off > 0 ? 'over' : 'under'} by {money(Math.abs(off), trip.currency)}.
           </p>
         )}
       </div>

       <ErrorNote error={state.error} />
       <button type="submit" className="btn btn-brand w-full" disabled={state.busy}>
         {state.busy ? 'Saving' : 'Save expense'}
       </button>
     </form>
   </Sheet>
 )
}

function BudgetPlanner({ trip, expenses, me, myBudget, lines, onChange, onBudgetChange }) {
 const planned = {}
 for (const line of lines) planned[line.category] = Number(line.planned)

 // Your own spend per category, taken from your share of each expense — a
 // 1,200 dinner split three ways lands as 400 in Food, automatically.
 const mine = myShareByCategory(expenses, me)
 const myTotal = sum(CATEGORIES, (c) => mine[c])
 const plannedTotal = sum(CATEGORIES, (c) => planned[c] || 0)
 const groupTotal = sum(expenses, (e) => e.amount)
 const cap = Number(myBudget) || 0

 return (
   <Panel title="Your budget" subtitle="Yours alone — everyone on the trip sets their own">
     <div className="mb-4 flex flex-wrap items-end justify-between gap-3 rounded-lg border border-line bg-paper/70 p-3">
       <div>
         <label className="label" htmlFor="bg-cap">What you plan to spend in total</label>
         <input id="bg-cap" type="number" min="0" step="500" defaultValue={cap || ''} placeholder="12000"
           className="field num w-40"
           onBlur={async (e) => {
             const next = Number(e.target.value) || 0
             if (next === cap) return
             await api.setMyBudget(trip.id, next)
             onBudgetChange()
           }} />
       </div>
       <p className="muted max-w-[22ch]">Saves when you click away. Nobody else can change your figure.</p>
     </div>

     {cap > 0 ? (
       <div className="mb-4">
         <div className="flex items-baseline justify-between">
           <p className="num text-sm">
             <span className="font-semibold">{money(myTotal, trip.currency)}</span>
             <span className="text-slate-550"> of your {money(cap, trip.currency)}</span>
           </p>
           <p className={cls('num text-[13px]', myTotal > cap ? 'text-alert' : 'text-slate-550')}>
             {myTotal > cap
               ? `${money(myTotal - cap, trip.currency)} over`
               : `${money(cap - myTotal, trip.currency)} left`}
           </p>
         </div>
         <div className="mt-1.5 h-1.5 overflow-hidden rounded-full bg-paper">
           <div className={cls('h-full transition-[width]', myTotal > cap ? 'bg-alert' : 'bg-brand')}
             style={{ width: `${Math.min(100, (myTotal / cap) * 100)}%` }} />
         </div>
         {plannedTotal > 0 && Math.abs(plannedTotal - cap) > 0.5 && (
           <p className="muted mt-1.5">
             Your category plans add up to {money(plannedTotal, trip.currency)} against a{' '}
             {money(cap, trip.currency)} personal budget.
           </p>
         )}
       </div>
     ) : (
       <p className="muted mb-4">Set a figure above to track how much of your own money is left.</p>
     )}

     <ul className="space-y-3">
       {CATEGORIES.map((category) => {
         const plan = planned[category] || 0
         const spentHere = mine[category]
         const pct = plan ? Math.min(100, (spentHere / plan) * 100) : spentHere > 0 ? 100 : 0
         const over = plan > 0 && spentHere > plan
         return (
           <li key={category}>
             <div className="flex items-center justify-between gap-3">
               <span className="text-sm font-medium">{category}</span>
               <div className="flex items-center gap-2">
                 <span className={cls('num text-[13px]', over ? 'text-alert' : 'text-slate-550')}>
                   {money(spentHere, trip.currency)}
                 </span>
                 <span className="muted">of</span>
                 <input type="number" min="0" step="100" defaultValue={plan || ''} placeholder="0"
                   aria-label={`Your planned budget for ${category}`} className="field num h-8 w-24 text-right"
                   onBlur={async (e) => {
                     const next = Number(e.target.value) || 0
                     if (next === plan) return
                     await api.saveBudgetLine(trip.id, category, next)
                     onChange()
                   }} />
               </div>
             </div>
             <div className="mt-1.5 h-1 overflow-hidden rounded-full bg-paper">
               <div className={cls('h-full transition-[width]', over ? 'bg-alert' : 'bg-brand')} style={{ width: `${pct}%` }} />
             </div>
           </li>
         )
       })}
     </ul>

     <p className="muted mt-3">
       Your figures come from your share of each expense, so splits count themselves.
       The group has spent {money(groupTotal, trip.currency)} in total.
     </p>
   </Panel>
 )
}

function SettleUp({ trip, members, me, net, history, onChange }) {
 const plan = settlementPlan(net)
 const currency = trip.currency

 return (
   <div className="space-y-4">
     <Panel title="Where everyone stands" subtitle="After every expense and payment recorded">
       <ul className="divide-y divide-line">
         {/* Anyone who touched the money, including members who have since
             left — otherwise their share would silently vanish. */}
         {[
           ...members,
           ...Object.keys(net)
             .filter((id) => !members.some((m) => m.id === id))
             .map((id) => ({ id, name: 'Former member', gone: true })),
         ].map((m) => {
           const value = net[m.id] ?? 0
           const flat = Math.abs(value) < 0.01
           return (
             <li key={m.id} className="flex items-center gap-3 py-2.5">
               <Avatar name={m.name} id={m.id} size="sm" />
               <span className="min-w-0 flex-1 truncate text-sm">
                 {m.name}
                 {m.id === me && <span className="text-slate-550"> · you</span>}
                 {m.gone && <span className="text-slate-550"> · left the trip</span>}
               </span>
               <span className={cls('num text-sm font-medium',
                 flat ? 'text-slate-550' : value > 0 ? 'text-brand' : 'text-alert')}>
                 {flat ? 'settled' : `${value > 0 ? 'gets back ' : 'owes '}${money(Math.abs(value), currency)}`}
               </span>
             </li>
           )
         })}
       </ul>
     </Panel>

     <Panel title="Settlement summary" subtitle="The fewest payments that clear the board">
       {!plan.length && <Empty title="All square" hint="Nothing outstanding between anyone on this trip." />}
       <ul className="space-y-2">
         {plan.map((t, i) => (
           <li key={`${t.from}-${t.to}-${i}`} className="stub flex flex-wrap items-center gap-3 px-3 py-2.5">
             <Avatar name={nameOf(members, t.from)} id={t.from} size="sm" />
             <span className="min-w-0 flex-1 text-sm">
               <span className="font-medium">{nameOf(members, t.from)}</span> pays{' '}
               <span className="font-medium">{nameOf(members, t.to)}</span>
             </span>
             <span className="num text-sm font-semibold">{money(t.amount, currency)}</span>
             <button type="button" className="btn btn-ghost btn-sm"
               onClick={async () => {
                 await api.insert('settlements', {
                   trip_id: trip.id, from_user: t.from, to_user: t.to,
                   amount: t.amount, note: 'Marked paid in TripSync',
                 })
                 onChange()
               }}>Mark paid</button>
           </li>
         ))}
       </ul>
     </Panel>

     {history.length > 0 && (
       <Panel title="Payments recorded" subtitle={`${history.length} transfer${history.length > 1 ? 's' : ''}`}>
         <ul className="divide-y divide-line">
           {history.map((s) => (
             <li key={s.id} className="flex items-center gap-3 py-2.5 text-sm">
               <span className="min-w-0 flex-1">{nameOf(members, s.from_user)} → {nameOf(members, s.to_user)}</span>
               <span className="num font-medium">{money(s.amount, currency)}</span>
               <button type="button" aria-label="Undo payment" className="rounded px-1 text-slate-550 hover:text-alert"
                 onClick={async () => { await api.remove('settlements', s.id); onChange() }}>✕</button>
             </li>
           ))}
         </ul>
       </Panel>
     )}
   </div>
 )
}

function HistoryPage({ userId }) {
 const history = useAsync(async () => {
   const trips = (await api.myTrips()).filter((t) => tripPhase(t) === 'past')
   const enriched = await Promise.all(trips.map(async (trip) => {
     const [expenses, members] = await Promise.all([api.expenses(trip.id), api.members(trip.id)])
     const total = sum(expenses, (e) => e.amount)
     const yours = round2(expenses.reduce((acc, e) =>
       acc + Number((e.expense_shares || []).find((s) => s.user_id === userId)?.amount || 0), 0))
     return { trip, total, yours, crew: members.length, days: tripLengthDays(trip) }
   }))
   return enriched.sort((a, b) =>
     String(b.trip.end_date || b.trip.created_at).localeCompare(String(a.trip.end_date || a.trip.created_at)))
 }, [userId])

 const rows = history.data || []
 const totals = {
   trips: rows.length,
   days: rows.reduce((a, r) => a + r.days, 0),
   spent: round2(rows.reduce((a, r) => a + r.yours, 0)),
   places: new Set(rows.map((r) => r.trip.destination).filter(Boolean)).size,
 }

 return (
   <div className="space-y-5">
     <div>
       <h1 className="text-[26px] font-bold leading-tight sm:text-[30px]">Travel history</h1>
       <p className="muted mt-0.5">
         Trips that have wrapped up, and what they cost you. Open one to reopen it, or clear out
         the ones you no longer need.
       </p>
     </div>

     {history.loading && <Loading label="Looking back through your trips" />}
     <ErrorNote error={history.error} onRetry={history.reload} />

     {!history.loading && !rows.length && (
       <Panel>
         <Empty title="No finished trips yet"
           hint="Trips move here once their end date passes or the organiser marks them finished." />
       </Panel>
     )}

     {rows.length > 0 && (
       <>
         <section className="card grid grid-cols-2 divide-line sm:grid-cols-4 sm:divide-x">
           {[
             ['Trips taken', String(totals.trips)],
             ['Days away', String(totals.days)],
             ['Places', String(totals.places || '—')],
             ['Your spend', money(totals.spent, rows[0].trip.currency)],
           ].map(([label, value]) => (
             <div key={label} className="px-4 py-3.5">
               <p className="muted">{label}</p>
               <p className="num mt-0.5 font-display text-[19px] font-bold leading-tight">{value}</p>
             </div>
           ))}
         </section>

         <Panel title="Past trips">
           <ul className="space-y-2.5">
             {rows.map(({ trip, total, yours, crew, days }) => (
               <li key={trip.id} className="stub flex items-stretch overflow-hidden">
                 <a href={`#/trip/${trip.id}`}
                   className="flex flex-1 flex-wrap items-center gap-x-4 gap-y-2 px-3.5 py-3 transition-colors hover:bg-paper/60">
                   <span className="min-w-0 flex-1">
                     <span className="block truncate font-display text-[16px] font-bold">{trip.name}</span>
                     <span className="muted block truncate">
                       {[trip.destination, dateRange(trip.start_date, trip.end_date)].filter(Boolean).join(' · ')}
                     </span>
                   </span>
                   <span className="flex gap-4 text-right">
                     <span><span className="muted block">Days</span><span className="num block text-sm font-medium">{days || '—'}</span></span>
                     <span><span className="muted block">Crew</span><span className="num block text-sm font-medium">{crew}</span></span>
                     <span><span className="muted block">Trip total</span><span className="num block text-sm font-medium">{money(total, trip.currency)}</span></span>
                     <span><span className="muted block">Your share</span><span className="num block text-sm font-medium">{money(yours, trip.currency)}</span></span>
                   </span>
                 </a>
                 {trip.created_by === userId && (
                   <button type="button" aria-label={`Delete ${trip.name}`}
                     className="shrink-0 border-l border-line px-3 text-[13px] text-slate-550 hover:bg-alert-wash hover:text-alert"
                     onClick={async () => {
                       if (!window.confirm(
                         `Delete "${trip.name}" for everyone?\n\nThe itinerary, expenses and messages all go with it. This cannot be undone.`
                       )) return
                       await api.deleteTrip(trip.id)
                       history.reload()
                     }}>
                     Delete
                   </button>
                 )}
               </li>
             ))}
           </ul>
         </Panel>
       </>
     )}
   </div>
 )
}

<!--
 NOTES

 Why this works without a build step
 - Tailwind's Play CDN compiles the utility classes in the browser and watches
   the DOM, so classes React renders later still get styles.
 - Babel Standalone compiles the JSX in the script tag above on page load.
 - Supabase's UMD bundle publishes window.supabase; the client here is `sb`.

 Cost of that convenience
 - About 1.5 MB of CDN JavaScript and a compile pass of a few hundred
   milliseconds on first load. Fine for a group of friends; if you want it
   lean, move this script into a Vite project and drop the Tailwind and Babel
   CDN tags — the code itself needs no changes beyond adding imports.

 Deploying
 - Netlify: drag the folder holding this file onto app.netlify.com/drop.
 - Vercel: `vercel --prod` in this folder; no build command, no output dir.
 - GitHub Pages: commit it as index.html on the default branch.
 - Then in Supabase → Authentication → URL Configuration, set Site URL to the
   deployed address so email confirmation links come back to the right place.

 Security
 - The anon key is meant to be public. Row level security in database.sql is
   what protects the data: a trip is readable only by its members, and
   location rows can only be written by the person they belong to.
-->
</body>
